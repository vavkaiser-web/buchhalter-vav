function setupSigCanvas() {
  function initCanvas(id) {
    const c = document.getElementById(id);
    if (!c) return null;
    const ctx = c.getContext('2d');
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false;
    function pos(e) {
      const r = c.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return [(src.clientX - r.left) * c.width / r.width, (src.clientY - r.top) * c.height / r.height];
    }
    c.addEventListener('mousedown',  e => { drawing = true; ctx.beginPath(); const [x,y]=pos(e); ctx.moveTo(x,y); });
    c.addEventListener('mousemove',  e => { if (!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
    c.addEventListener('mouseup',    () => drawing = false);
    c.addEventListener('mouseleave', () => drawing = false);
    c.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ctx.beginPath(); const [x,y]=pos(e); ctx.moveTo(x,y); }, {passive:false});
    c.addEventListener('touchmove',  e => { e.preventDefault(); if (!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); }, {passive:false});
    c.addEventListener('touchend',   () => drawing = false);
    return c;
  }
  const canvas = initCanvas('sig-canvas');
  const canvasAusgabe = initCanvas('sig-canvas-ausgabe');
  if (!canvas) return;

  function isBlank(c) {
    const blank = document.createElement('canvas'); blank.width = c.width; blank.height = c.height;
    return c.toDataURL() === blank.toDataURL();
  }

  document.getElementById('sig-clear')?.addEventListener('click', () => canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height));
  document.getElementById('sig-clear-ausgabe')?.addEventListener('click', () => canvasAusgabe?.getContext('2d').clearRect(0,0,canvasAusgabe.width,canvasAusgabe.height));

  document.getElementById('sig-save')?.addEventListener('click', async () => {
    if (isBlank(canvas)) { toast('Unterschrift Empfänger fehlt', 'err'); return; }
    if (canvasAusgabe && isBlank(canvasAusgabe)) { toast('Unterschrift Kassierer fehlt', 'err'); return; }
    const sig = canvas.toDataURL('image/png');
    const sigAusgabe = canvasAusgabe ? canvasAusgabe.toDataURL('image/png') : null;
    const btn = document.getElementById('sig-save'); if (btn) btn.disabled = true;
    try {
      await api('POST', 'quittung/' + S.signaturStep.id + '/unterschrift', { unterschrift: sig, ausgabe_unterschrift: sigAusgabe });
      await api('POST', 'quittung/' + S.signaturStep.id + '/ausgeben', {});
      window.open('/api/k/quittung/' + S.signaturStep.id + '/druck', '_blank');
      toast('Unterschriften gespeichert · Geld ausgezahlt · ' + S.signaturStep.nr);
    } catch(err) { toast(err.message, 'err'); if (btn) btn.disabled = false; return; }
    S.signaturStep = null; S.modal = null;
    await lageLaden(); renderApp();
  });

  const chekInput = document.getElementById('chek-input');
  if (chekInput) {
    chekInput.addEventListener('change', async () => {
      const file = chekInput.files[0];
      if (!file) return;
      const chekArea = document.getElementById('chek-area');
      const chekStatus = document.getElementById('chek-status');
      chekStatus.textContent = 'Загрузка…';
      if (chekArea) chekArea.style.opacity = '0.6';
      try {
        const sha = await uploadDatei(file);
        await api('POST', 'quittung/' + S.signaturStep.id + '/foto', { sha });
        if (chekArea) { chekArea.style.background = 'var(--v-ok-bg,#e8f5e9)'; chekArea.style.borderColor = '#35674e'; chekArea.style.opacity = '1'; }
        chekStatus.textContent = '✓ ' + file.name;
        const ausgBtn = document.getElementById('chek-ausgeben');
        if (ausgBtn) ausgBtn.style.display = '';
        toast('Квитанция прикреплена · ' + S.signaturStep.nr);
      } catch(err) {
        chekStatus.textContent = 'Ошибка: ' + err.message;
        if (chekArea) chekArea.style.opacity = '1';
        toast(err.message, 'err');
      }
    });
  }

  document.getElementById('chek-ausgeben')?.addEventListener('click', async () => {
    const btn = document.getElementById('chek-ausgeben'); if (btn) btn.disabled = true;
    try {
      await api('POST', 'quittung/' + S.signaturStep.id + '/ausgeben', {});
      window.open('/api/k/quittung/' + S.signaturStep.id + '/druck', '_blank');
      toast('Деньги выданы по квитанции · ' + S.signaturStep.nr);
    } catch(err) { toast(err.message, 'err'); if (btn) btn.disabled = false; return; }
    S.signaturStep = null; S.modal = null;
    await lageLaden(); renderApp();
  });

  document.getElementById('sig-abbrechen')?.addEventListener('click', async () => {
    if (!confirm('Отменить выдачу ' + S.signaturStep.nr + '?')) return;
    try { await api('POST', 'quittung/' + S.signaturStep.id + '/abbrechen', {}); toast('Выдача отменена'); }
    catch(err) { toast(err.message, 'err'); return; }
    S.signaturStep = null; S.modal = null;
    await lageLaden(); renderApp();
  });
}

let pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pwaPrompt = e;
  // Показываем кнопку "Установить" в шапке после рендера.
  document.getElementById('install-btn')?.removeAttribute('hidden');
});
</script>
</body>
