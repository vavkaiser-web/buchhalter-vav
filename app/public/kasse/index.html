<style>
/* === Дизайн-система VAV — эталонный CSS (MD5: 75cf11c8e42de979bd6ec8c56e660846) === */
:root{--v-bg:light-dark(#ebe7df,#171918);--v-paper:light-dark(#fcfaf6,#222625);--v-soft:light-dark(#f3efe7,#2a302e);--v-ink:light-dark(#201f1b,#eeeae1);--v-sub:light-dark(#69675f,#b4b8b0);--v-line:light-dark(#ded9cf,#3d4540);--v-accent:light-dark(#14455e,#9bcbe1);--v-on:light-dark(#fffdf9,#102631);--v-tint:light-dark(#e3ecf0,#253c45);--v-green:light-dark(#35674e,#9ac6aa);--v-greenbg:light-dark(#e7efe8,#263e2e);--v-warn:light-dark(#896021,#e4c18b);--v-warnbg:light-dark(#f4ead8,#493a24);--v-red:light-dark(#9a4035,#f0aaa0);--v-redbg:light-dark(#f6e5e0,#482d29);font:14px/1.45 'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--v-ink);--v-radius:12px;--v-space:18px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--v-accent);outline-offset:3px}
button{border:0}
h1,h2,h3,p{margin:0}
h1{font-size:28px;letter-spacing:-.8px;font-weight:600}
h2{font-size:19px;font-weight:600;letter-spacing:-.3px}
h3{font-size:15px;font-weight:600}
.v-small{font-size:12px;color:var(--v-sub)}
.v-num{font-variant-numeric:tabular-nums}
.v-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--v-sub)}
.v-seg{display:flex;flex-wrap:wrap;gap:3px;padding:4px;border:1px solid var(--v-line);border-radius:10px;background:var(--v-paper)}
.v-seg button{background:transparent;padding:8px 14px;border-radius:7px;color:var(--v-sub)}
.v-seg button[aria-pressed=true]{background:var(--v-accent);color:var(--v-on)}
.v-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--v-soft);color:var(--v-sub);white-space:normal}
.v-tag.warn{background:var(--v-warnbg);color:var(--v-warn)}
.v-tag.good{background:var(--v-greenbg);color:var(--v-green)}
.v-tag.bad{background:var(--v-redbg);color:var(--v-red)}
.v-app{background:var(--v-paper);border:1px solid var(--v-line);border-radius:16px;overflow:hidden;min-height:100svh}
.v-top{padding:16px 20px;border-bottom:1px solid var(--v-line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.v-logo{display:flex;gap:9px;align-items:center;font-weight:700;letter-spacing:1px;font-size:12px}
.v-mark{width:29px;height:29px;background:var(--v-accent);color:var(--v-on);display:grid;place-items:center;border-radius:7px;font-size:18px;letter-spacing:-3px;padding-right:3px}
.v-topright{margin-left:auto;display:flex;gap:10px;align-items:center}
.v-avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--v-soft);font-size:11px;cursor:pointer}
.v-layout{display:grid;grid-template-columns:164px minmax(0,1fr)}
.v-sidebar{padding:22px 10px;border-right:1px solid var(--v-line);display:flex;flex-direction:column;gap:4px}
.v-sidebar button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 10px;background:none;border-radius:8px;font-size:13px;color:var(--v-sub)}
.v-sidebar button.active{background:var(--v-tint);color:var(--v-accent);font-weight:600}
.v-count{margin-left:auto;font-size:11px}
.v-sidebarfoot{margin-top:auto;padding:45px 10px 5px;font-size:11px;color:var(--v-sub)}
.v-content{padding:26px;background:var(--v-bg);min-width:0;min-height:680px}
.v-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.v-head p{color:var(--v-sub);font-size:13px;margin-top:5px}
.v-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 13px;border:1px solid var(--v-line);border-radius:8px;background:var(--v-paper);font-size:12px;min-height:38px;cursor:pointer}
.v-button.primary{background:var(--v-accent);color:var(--v-on);border-color:var(--v-accent)}
.v-button.full{width:100%}
.v-button:disabled{opacity:.55;cursor:default}
.v-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.v-metric{padding:16px;text-align:left;background:var(--v-paper);border:1px solid var(--v-line);border-radius:var(--v-radius);cursor:pointer}
.v-metric strong{display:block;font-size:24px;letter-spacing:-.8px;font-weight:500;margin:6px 0}
.v-metric span{display:block;font-size:12px;color:var(--v-sub)}
.v-work{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.88fr);gap:16px;align-items:start}
.v-panel{background:var(--v-paper);border:1px solid var(--v-line);border-radius:var(--v-radius);overflow:hidden}
.v-panelhead{padding:16px var(--v-space);border-bottom:1px solid var(--v-line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.v-tabs{display:flex;gap:13px;padding:12px 16px;border-bottom:1px solid var(--v-line);flex-wrap:wrap}
.v-tabs button{background:none;padding:2px 0 5px;font-size:12px;color:var(--v-sub);border-bottom:2px solid transparent}
.v-tabs button.active{color:var(--v-accent);border-color:var(--v-accent)}
.v-row{display:flex;width:100%;padding:var(--v-space);gap:11px;text-align:left;background:var(--v-paper);border-bottom:1px solid var(--v-line);align-items:flex-start;cursor:pointer}
.v-row:last-child{border-bottom:0}
.v-row:hover{background:var(--v-soft)}
.v-row.selected{background:var(--v-tint);box-shadow:inset 3px 0 var(--v-accent)}
.v-file{width:34px;height:40px;display:grid;place-items:center;border:1px solid var(--v-line);border-radius:7px;color:var(--v-sub);background:var(--v-paper);flex-shrink:0}
.v-rowmain{flex:1;min-width:0}
.v-rowline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.v-rowtitle{font-weight:600;font-size:13px}
.v-row .v-small{margin:3px 0 9px}
.v-row .v-num{font-size:13px;font-weight:500}
.v-detail{padding:18px}
.v-detail .v-amount{font-size:30px;font-weight:500;letter-spacing:-1px;margin:8px 0 2px}
.v-detail hr{border:0;border-top:1px solid var(--v-line);margin:17px 0}
.v-keyvalue{display:flex;justify-content:space-between;gap:16px;font-size:12px;padding:6px 0}
.v-keyvalue span:first-child{color:var(--v-sub)}
.v-keyvalue span:last-child{text-align:right}
.v-receipt{margin:16px 0;background:var(--v-soft);padding:13px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer}
.v-receipt strong{font-size:12px;display:block}
.v-check{font-size:12px;display:flex;gap:8px;align-items:flex-start;margin:10px 0}
.v-check i{color:var(--v-green)}
.v-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.v-actions>*{flex:1}
.v-note{padding:11px 12px;background:var(--v-warnbg);color:var(--v-warn);border-radius:8px;font-size:12px;margin:12px 0}
.v-footer{margin-top:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--v-sub)}
.v-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.v-ledger{padding:18px}
.v-event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--v-line)}
.v-event:last-child{border:0}
.v-event .v-num{margin-left:auto;white-space:nowrap}
.v-modal{margin-top:16px;border:1px solid var(--v-accent);border-radius:12px;padding:20px;background:var(--v-paper)}
.v-modalheader{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}
.v-form{display:grid;gap:13px}
.v-form label{display:grid;gap:6px;font-size:12px;color:var(--v-sub)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--v-line);background:var(--v-paper);color:var(--v-ink);border-radius:8px;font-size:14px;min-width:0}
.v-formpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v-toast{padding:11px 16px;border-radius:9px;margin-top:12px;font-size:13px}
.v-toast.ok{background:var(--v-greenbg);color:var(--v-green)}
.v-toast.err{background:var(--v-redbg);color:var(--v-red)}
.v-upload{display:grid;justify-items:center;gap:8px;padding:25px 12px;border:1px dashed var(--v-accent);border-radius:12px;background:var(--v-tint);color:var(--v-accent);width:100%;margin:15px 0;cursor:pointer}
.v-stateempty{padding:25px;text-align:center;color:var(--v-sub)}
.v-sync{font-size:11px;color:var(--v-sub);display:flex;align-items:center;gap:6px}
.v-sync.err{color:var(--v-red)}
[hidden]{display:none!important}
svg{width:17px;height:17px;flex-shrink:0}
/* Мобильный телефон */
.v-phonebar{display:flex;justify-content:space-between;padding:14px 22px 8px;font-size:12px;font-weight:600}
.v-phonebody{padding:22px;background:var(--v-bg);min-height:510px}
.v-bottom{display:flex;border-top:1px solid var(--v-line);padding:10px 8px;background:var(--v-paper)}
.v-bottom button{display:grid;justify-items:center;gap:4px;flex:1;padding:7px 4px;background:none;font-size:11px;color:var(--v-sub)}
.v-bottom button.active{color:var(--v-accent)}
/* --- Скрытие/показ по устройству --- */
body{margin:0;background:var(--v-bg)}
.wrap{max-width:1280px;margin:0 auto;padding:0}
@media(max-width:860px){
  .v-layout{grid-template-columns:1fr}
  .v-sidebar{flex-direction:row;border-right:0;border-bottom:1px solid var(--v-line);padding:8px;flex-wrap:wrap}
  .v-sidebar button{width:auto;font-size:12px;padding:8px}
  .v-sidebarfoot{display:none}
  .v-content{padding:18px}
  .v-count{margin-left:4px}
  .v-app{border-radius:0}
}
@media(max-width:620px){
  .v-work{grid-template-columns:1fr}
  .v-metrics{gap:7px}
  .v-metric{padding:11px}
  .v-metric strong{font-size:20px}
  .v-three{grid-template-columns:1fr}
  .v-topright .v-small{display:none}
  .v-content{padding:14px}
  .v-top{padding:12px}
  h1{font-size:24px}
  .v-seg button{padding:8px 10px}
  .v-formpair{grid-template-columns:1fr}
}
/* Загрузка */
#loading{position:fixed;inset:0;background:var(--v-bg);display:grid;place-items:center;font-size:13px;color:var(--v-sub);z-index:100}
/* Страница входа */
#login-page{display:none;min-height:100svh;background:var(--v-bg);place-items:center}
#login-page.show{display:grid}
.login-box{background:var(--v-paper);border:1px solid var(--v-line);border-radius:16px;padding:32px;width:100%;max-width:360px;margin:16px}
</style>
</head>
<body>
<div id="loading"><span>Загрузка…</span></div>

<!-- Страница входа -->
<div id="login-page">
  <div class="login-box">
    <div class="v-logo" style="margin-bottom:28px">
      <span class="v-mark">₽</span>
      <span>КАССА VAV</span>
    </div>
    <form id="login-form" class="v-form">
      <label>Логин
        <input id="l-login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>ПИН
        <input id="l-pin" name="pin" type="password" autocomplete="current-password" inputmode="numeric" required>
      </label>
      <button type="submit" class="v-button primary full" id="l-submit">Войти</button>
      <div id="l-err" class="v-toast err" hidden></div>
    </form>
  </div>
</div>

<!-- Основное приложение -->
<div id="app" hidden></div>
<div id="toast-area" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;min-width:260px;max-width:90vw"></div>

<script type="module">
/* ======================================================
   Касса VAV — клиентская логика.
   Все данные от /api/k/* и /api/ich.
   Дизайн: эталон approved-design.html (MD5 75cf11c8e42de979bd6ec8c56e660846).
   ====================================================== */

const euro = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format((n||0)/100);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = n => `<i data-lucide="${n}" aria-hidden="true"></i>`;
const keys = rows => rows.filter(r=>r&&r[0]&&r[1]!=null).map(([k,v])=>`<div class="v-keyvalue"><span>${esc(k)}</span><span>${v}</span></div>`).join('');
const btn = (txt,act,cls='',extra='') => `<button type="button" class="v-button ${cls}" data-action="${act}" ${extra}>${txt}</button>`;

const BEW_ART = {abhebung:'Bankabhebung',uebergabe:'Übergabe Bargeld',rueckgabe:'Rückgabe',ausgabe:'Kassenausgabe',verbrauch:'Verbrauch'};
function bewArtText(b) {
  if (b.art === 'abhebung' && b.notiz && b.notiz.startsWith('Einzahlung:')) return 'Einzahlung';
  return BEW_ART[b.art] || b.art;
}
function bewArt(art, b){ if (b) return bewArtText(b); return BEW_ART[art]||art; }
function bewDatum(b){ return b.datum ? new Date(b.datum+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function wDatum(){ const d=new Date(); return d.toLocaleDateString('sv-SE'); }
function bewDokInfo(b){
  const bl = S.lage?.bank_links||[];
  const bankLink = bl.find(l=>l.ziel_art==='abhebung'&&l.ziel_id===String(b.id)&&l.status==='abgeglichen');
  const hasBank = bankLink || b.finmap_op;
  const hasBeleg = b.beleg_id || b.quittung_id;
  return { bankLink, hasBank:!!hasBank, hasBeleg:!!hasBeleg, ok: !!(hasBank||hasBeleg) };
}

/* ---------- Адаптер данных API → UI ---------- */
function adaptLage(raw) {
  if (!raw) return null;
  const konten = raw.konten || [];
  const hk = konten.find(k=>k.art==='hauptkasse');
  const hauptkasse = hk?.saldo ?? null;
  const halter = konten.filter(k=>k.art==='halter').map(k=>({
    id: k.id, login: k.login, name: k.name, kurzname: k.name, saldo: k.saldo||0,
    reserviert: k.reserviert||0, frei: k.frei ?? k.saldo ?? 0,
    erhalten: k.erhalten||0, ausgaben: k.ausgaben||0, zurueck: k.zurueck||0,
  }));
  const firma = raw.firma || 'VAV Kaiser GmbH';
  // Движения: добавляем человекочитаемые поля
  const bewegungen = (raw.bewegungen||[]).slice(0,30).map(b=>({
    ...b, betrag_cent: b.betrag, bezeichnung: bewArtText(b),
    von_konto_name: b.von_name, an_konto_name: b.an_name,
    wann_text: b.datum ? new Date(b.datum).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '',
  }));
  // Все снятия по датам (для ручного заведения в кассу).
  // verteilt берётся с сервера (по всей таблице без LIMIT), не из урезанного списка движений.
  const _abhVerteilt = raw.abhebungen_verteilt || {};
  const abhebungen_alle = (raw.bewegungen||[])
    .filter(b => b.art === 'abhebung' && b.status !== 'storniert')
    .map(b => {
      const verteilt = _abhVerteilt[b.id] ?? 0;
      const rest = Math.max(0, b.betrag - verteilt);
      return { ...b, betrag_cent: b.betrag, verteilt, rest,
        wann_text: b.datum ? new Date(b.datum).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '' };
    })
    .sort((a, b) => a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : a.id - b.id);
  // Чеки: в очередь попадают ausstehend и rueckfrage
  const belege_queue = (raw.belege||[]).filter(b=>['ausstehend','rueckfrage'].includes(b.status)).map(b=>({
    ...b, ref: String(b.id), betrag_cent: b.betrag, person_name: b.person,
    erstellt_text: b.datum ? new Date(b.datum).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '',
    erstellt_ts: b.id,
  }));
  // Мои чеки
  const meine_belege = (raw.belege||[]).map(b=>({
    ...b, ref: String(b.id), betrag_cent: b.betrag, person_name: b.person,
    erstellt_text: b.datum ? new Date(b.datum).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '',
    erstellt_ts: b.id,
  }));
  // Заявки на аванс: открытые
  const plaene_offen = (raw.plaene||[]).filter(p=>!['storniert','abgelehnt','ausgegeben'].includes(p.status)).map(p=>({
    ...p, ref: p.nr, plan_ref: true, betrag_cent: p.summe,
    bezeichnung: p.titel||'Аванс', person_name: p.initiator,
    erstellt_text: p.angelegt ? new Date(p.angelegt).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '',
    erstellt_ts: p.id,
  }));
  const meine_plaene = plaene_offen;
  // Вопросы
  const rueckfragen_offen = (raw.rueckfragen||[]).filter(r=>r.status==='offen').length;
  // Входящие от vavapp
  const ZAHLART_TEXT = {firmenkarte:'Карта фирмы',privatkarte:'Своя карта',bar:'Наличные'};
  const eingaenge = (raw.eingaenge||[]).map(e=>({
    ...e, ref: String(e.id), ea_ref: e.kasse_ref, _typ: 'ea',
    betrag_cent: e.betrag,
    bezeichnung: e.art==='vorschuss' ? 'Аванс от VAV App' : 'Чек от VAV App',
    person_name: e.person_name || e.person_id || '—',
    erstellt_text: e.erstellt_am ? new Date(e.erstellt_am).toLocaleDateString('de-DE',{day:'numeric',month:'short'}) : '',
    erstellt_ts: e.id,
    erledigt: !!e.verarbeitet_am,
    zahlart_text: e.zahlart ? (ZAHLART_TEXT[e.zahlart] || e.zahlart) : null,
    foto_sha: e.datei_sha || null,
  }));
  // Квитанции: готовы к выдаче (план одобрен, кассир назначен)
  const quittungenVorbereitet = (raw.quittungen||[]).filter(q => q.status === 'vorbereitet' && q.plan_status === 'genehmigt');
  // Квитанции: выдано, оригинал ещё не получен бухгалтером
  const quittungenOriginalFehlt = (raw.quittungen||[]).filter(q => q.status === 'ausgegeben' && !q.original_am);
  const eingang_anzahl = belege_queue.length + plaene_offen.length + eingaenge.filter(e=>!e.erledigt).length + quittungenVorbereitet.length;
  // Объекты и машины для форм
  const objekte = (raw.objekte||[]).map(o=>({id: o.nummer, name: o.bez||o.nummer}));
  const fahrzeuge = (raw.fahrzeuge||[]).map(f=>({id: f.id, kennzeichen: f.text||f.id}));
  return { ...raw, kasse: { hauptkasse, reserviert: hk?.reserviert||0, frei: hk?.frei ?? hauptkasse }, halter, firma, bewegungen, abhebungen_alle, belege_queue, meine_belege,
    plaene_offen, meine_plaene, rueckfragen_offen, eingang_anzahl, objekte, fahrzeuge, eingaenge,
    quittungenVorbereitet, quittungenOriginalFehlt };
}

/* ---------- Состояние приложения ---------- */
const TRANS = {
  ru: {
    header: 'КАССА VAV', lang_btn: 'DE', logout: 'Выйти',
    nav_desk:'Рабочий стол', nav_eingang:'Очередь', nav_kasse:'Касса', nav_req:'Запросы',
    nav_mein:'Мой кабинет', nav_avans:'Авансы', nav_fragen:'Вопросы', nav_quittungen:'Квитанции',
    bank_panel:'Снятия из банка', in_kasse:'В кассу', not_in_kasse:'Не в кассе',

/* ---------- API ---------- */
async function api(methode, pfad, koerper) {
  const opt = { method: methode, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
  if (koerper !== undefined) opt.body = JSON.stringify(koerper);
  const r = await fetch('/api/k/' + pfad, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.fehler || 'Ошибка ' + r.status), { status: r.status });
  return j;
}
async function uploadDatei(file) {
  const buf = await file.arrayBuffer();
  const r = await fetch('/api/k/datei', {
    method: 'POST',
    headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-Dateiname': encodeURIComponent(file.name) },
    credentials: 'same-origin',
    body: buf,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.fehler || 'Ошибка загрузки файла');
  return j.sha;
}

async function lageLaden() {
  try {
    const raw = await api('GET', 'lage');
    S.lage = adaptLage(raw);
    S.sync = { ok: true, wann: new Date() };
  } catch (e) {
    S.sync = { ok: false, wann: new Date(), fehler: e.message };
  }
}

/* ---------- Toast-уведомления ---------- */
function toast(text, typ='ok') {
  const el = document.getElementById('toast-area');
  const d = document.createElement('div');
  d.className = 'v-toast ' + typ;
  d.textContent = text;
  el.append(d);
  setTimeout(() => d.remove(), 4000);
}

/* ---------- Шаблоны ---------- */
function statusTag(zustand) {
  const m = {
    entwurf:     ['warn','Черновик'],
    eingereicht: ['warn','На проверке'],
    bewilligt:   ['good','Одобрено'],
    genehmigt:   ['good','Одобрено'],
    abgelehnt:   ['bad','Отклонено'],
    ausgegeben:  ['good','Деньги выданы'],
    ausstehend:  ['warn','На проверке'],
    rueckfrage:  ['warn','Требует уточнения'],
    geprueft:    ['good','Проверено'],
    erstattet:   ['good','Возмещено'],
    gemeldet:    ['warn','Ожидает'],
    bestaetigt:  ['good','Подтверждено'],
  };
  const [cls,t] = m[zustand] || ['','?'];
  return `<span class="v-tag ${cls}">${esc(t)}</span>`;
}

  ${meine.length ? meine.map(r=>itemZeile(r)).join('') : '<div class="v-stateempty">Документов нет</div>'}
</div>`;
}

function renderQuittungen() {
  const qt = S.lage?.quittungen || [];
  const r = S.ich?.rolle;
  const isBuch = r === 'buchhaltung' || r === 'gf';
  const isDisp = r === 'disponent';
  const statusLabel = { vorbereitet:'Vorbereitet', ausgegeben:'Ausgegeben', storniert:'Storniert' };
  return `
<div class="v-head">
  <div>
    <div class="v-label">Quittungsarchiv</div>
    <h1>${t('nav_quittungen')}</h1>
    <p>Alle Quittungen – hier ablesen, prüfen und bei Bedarf drucken.</p>
  </div>
</div>
<div class="v-panel">
  <div class="v-panelhead"><h2>${t('nav_quittungen')} (${qt.length})</h2></div>
  ${qt.length ? qt.map(q=>`
  <div class="v-row" style="cursor:default">
    <span class="v-file">${icon('receipt')}</span>
    <span class="v-rowmain" style="flex:1;min-width:0">
      <span class="v-rowline">
        <span class="v-rowtitle">${esc(q.nr||'—')} · ${esc(q.empfaenger||'—')}</span>
        <span class="v-num">${euro(q.betrag)}</span>
      </span>
      <span class="v-small" style="display:block">${esc(statusLabel[q.status]||q.status)} · ${q.ausgegeben_am ? new Date(q.ausgegeben_am).toLocaleDateString('de-DE') : '—'}</span>
    </span>
    <span style="display:flex;gap:6px;flex-shrink:0;align-items:center">
      ${statusTag(q.status)}
      ${(isBuch || isDisp) && q.status !== 'storniert' ? `<button class="v-button small" data-action="quittungDrucken" data-qt-id="${q.id}">${t('drucken')}</button>` : ''}
    </span>
  </div>`).join('') : '<div class="v-stateempty">Keine Quittungen vorhanden</div>'}
</div>`;
}

function renderRueckfragen() {
  const list = S.lage?.rueckfragen||[];
  return `
<div class="v-head">
  <div>
    <div class="v-label">Запросы и уточнения</div>
    <h1>Вопросы</h1>
    <p>Сотрудник — 2 рабочих дня · Олег — 1 рабочий день · Андрей — решение.</p>
  </div>
</div>
<div class="v-panel">
  <div class="v-panelhead"><h2>${t('rueck_title')}</h2><span class="v-tag warn">${list.filter(r=>r.status==='offen').length} ${t('rueck_offen')}</span></div>
  ${list.length ? list.map(r=>`
  <button class="v-row" data-record="${esc(r.id)}" data-typ="rueckfrage">
    <span class="v-file">${icon('message-circle')}</span>
    <span class="v-rowmain">
      <span class="v-rowline">
        <span class="v-rowtitle">${esc(r.text_kurz||r.id)}</span>
        <span class="v-num">${esc(r.beleg_ref||'')}</span>
      </span>
      <span class="v-small" style="display:block">${esc(r.person_name||'')} · ${esc(r.erstellt_text||'')}</span>
      ${statusTag(r.status||'offen')}
    </span>
  </button>`).join('') : '<div class="v-stateempty">Открытых вопросов нет</div>'}
</div>`;
}

function renderKasse() {
  const l = S.lage || {};
  const istGf = S.ich?.rolle === 'gf';
  return `
<div class="v-head">
  <div>
    <div class="v-label">Кассовый журнал</div>
    <h1>Касса и авансы</h1>
    <p>Показаны только подтверждённые движения.</p>
  </div>
  <div style="display:flex;gap:8px">
    ${istGf ? btn(icon('building-2')+' Abhebung','neueAbhebung','') : ''}
    ${(istGf || S.ich?.rolle === 'disponent' || S.ich?.rolle === 'buchhaltung') ? btn(icon('arrow-down-circle')+' '+t('einzahlung_btn'),'neueEinzahlung','') : ''}
    ${S.ich?.rolle !== 'mitarbeiter' ? btn(icon('plus')+' Übergabe','neueUebergabe','primary') : ''}
    ${istGf ? btn(icon('scale')+' Kassenprüfung','kasseSverka','') : ''}
  </div>
</div>
<div class="v-metrics">
  <button class="v-metric" data-action="metrikNalichnye">
    <span>Наличные в кассе</span>
    <strong class="v-num">${euro(l.kasse?.hauptkasse)}</strong>
    <span>Свободно: ${euro(l.kasse?.frei)} · Резерв: ${euro(l.kasse?.reserviert)} ↗</span>
  </button>
  ${(l.halter||[]).map(h=>`
  <button class="v-metric" data-action="metrikHalter" data-login="${esc(h.login)}">
    <span>У ${esc(h.kurzname||h.name||h.login)} (директор)</span>
    <strong class="v-num">${euro(h.saldo)}</strong>
    <span>Свободно: ${euro(h.frei)} · Резерв: ${euro(h.reserviert)} ↗</span>
  </button>`).join('')}
</div>
<div class="v-panel">
  <div class="v-panelhead"><h2>${t('journal')}</h2></div>
  <div class="v-ledger">
    ${(l.bewegungen||[]).slice().reverse().map(b=>{
      const dok = bewDokInfo(b);
      const needDok = ['abhebung','uebergabe','ausgabe','verbrauch'].includes(b.art);
      const dokBadge = dok.ok
        ? `<span title="Документ прикреплён" style="color:var(--v-ok,#2e7d32)">${icon('paperclip')}</span>`
        : (needDok ? `<span title="Нет документа" style="color:var(--v-warn,#e65100)">${icon('alert-circle')}</span>` : '');
      return `<button class="v-row cursor-interaction" data-action="bewegungDetail" data-bew-id="${b.id}" style="width:100%;text-align:left">
        ${icon('arrow-right-left')}
        <span class="v-rowmain" style="flex:1;min-width:0">
          <span class="v-rowline">
            <span class="v-rowtitle">${esc(bewArt(b.art,b))}</span>
            <span class="v-num">${euro(b.betrag)}</span>
          </span>
          <span class="v-small" style="display:block">${bewDatum(b)} · ${esc(b.von_name||'—')} → ${esc(b.an_name||'—')}</span>
        </span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          ${statusTag(b.status)}
          ${dokBadge}
        </span>
      </button>`;
    }).join('')||'<div class="v-stateempty">Движений нет</div>'}
  </div>
</div>`;
}

/* ---------- Модальные окна ---------- */
function renderModal(mod) {
  if (!mod) return '';
  let title='', body='';
  if (mod==='neueAbhebung') {
    title = 'Снятие наличных';
    if (S.abhDupWarn) {
      // Слой 2: показываем предупреждение о дубликате
      body = `<div class="v-note" style="background:var(--v-warn-bg,#fff3cd);border:1px solid var(--v-warn,#f0ad4e);padding:12px;border-radius:6px;margin-bottom:12px">
        ⚠️ ${esc(S.abhDupWarn.msg)}
      </div>
      <div style="display:flex;gap:8px">
        <button class="v-button full" data-action="abhDupCancel">${t('cancel')}</button>
        <button class="v-button primary full" data-action="abhDupForce">Всё равно сохранить</button>
      </div>`;
    } else {
      body = `<form id="abhebung-form" class="v-form">
        <div class="v-note">Фиксируем наличные, полученные из банка. После записи можно распределить в кассу.</div>
        <label>Дата снятия<input name="datum" type="date" value="${wDatum()}" required></label>
        <label>Сумма, €<input name="betrag" inputmode="decimal" placeholder="0,00" required></label>
        <label>Примечание<input name="notiz" placeholder="Снятие в банке (необязательно)" maxlength="120"></label>
        <button type="submit" class="v-button primary full">${t('save_abh')}</button>
      </form>`;
    }
  } else if (mod==='kasseSverka') {
    // Слой 4: сверка снятий по месяцам
    title = 'Сверка снятий';
    const abh = (S.lage?.bewegungen||[]).filter(b=>b.art==='abhebung');
    const byMonth = {};
    abh.forEach(b => {
      const m = (b.datum||'').slice(0,7);
      if (!byMonth[m]) byMonth[m] = 0;
      byMonth[m] += Number(b.betrag_cent||0);
    });
    const rows = Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0]));
    body = `<div class="v-note">Суммы снятий из банка по месяцам. Сверьте с выпиской Qonto.</div>
    <div class="v-ledger">
      ${rows.length ? rows.map(([m,s])=>`
        <div class="v-event">
          <span style="flex:1">${m}</span>
          <span class="v-num">${euro(s)}</span>
        </div>`).join('') : '<div class="v-stateempty">Снятий нет</div>'}
    </div>
    <div class="v-event" style="font-weight:600;border-top:1px solid var(--v-brd);padding-top:8px;margin-top:4px">
      <span style="flex:1">Итого</span>
      <span class="v-num">${euro(abh.reduce((s,b)=>s+Number(b.betrag_cent||0),0))}</span>
    </div>`;
  } else if (mod==='neueUebergabe') {
    title = 'Übergabe Bargeld';
    body = `<form id="uebergabe-form" class="v-form">
      <label>Empfänger<select name="an_konto">
        ${(S.lage?.halter||[]).map(h=>`<option value="${esc(h.id)}">${esc(h.kurzname||h.name||h.login)}</option>`).join('')}
        <option value="hauptkasse">Hauptkasse</option>
      </select></label>
      <label>Betrag, €<input name="betrag" inputmode="decimal" placeholder="0,00" required></label>
      <button type="submit" class="v-button primary full">Übergabe erstellen</button>
    </form>`;
  } else if (mod==='neueEinzahlung') {
    title = t('einzahlung_title');
    body = `<form id="einzahlung-form" class="v-form">
      <div class="v-note">Bargeld kommt in die Kasse: Kreditrückzahlung, Vorschussrückgabe oder Kundenzahlung.</div>
      <label>Datum<input name="datum" type="date" value="${wDatum()}" required></label>
      <label>Betrag, €<input name="betrag" inputmode="decimal" placeholder="0,00" required></label>
      <label>Grund<select name="grund">
        <option value="kredit">${t('einzahlung_grund_kredit')}</option>
        <option value="vorschuss">${t('einzahlung_grund_vorschuss')}</option>
        <option value="kunde">${t('einzahlung_grund_kunde')}</option>
        <option value="sonstiges">${t('einzahlung_grund_sonst')}</option>
      </select></label>
      <label>Person / Firma<input name="person" placeholder="Name des Einzahlers" maxlength="120"></label>
      <label>Notiz<input name="notiz" placeholder="Zusatzinfo (optional)" maxlength="100"></label>
      <button type="submit" class="v-button primary full">Einzahlung erfassen</button>
    </form>`;
  } else if (mod==='neuerBeleg') {
    title = 'Добавить чек';
    body = `<form id="beleg-form" class="v-form">
      <input type="hidden" name="art" value="kraftstoff">
      <div class="v-seg" style="margin-bottom:4px">
        ${[['kraftstoff','Бензин'],['material','Материалы'],['sonstig','Другое']].map(([v,t])=>
          `<button type="button" class="art-btn" data-art="${v}" aria-pressed="${v==='kraftstoff'}">${t}</button>`).join('')}
      </div>
      <label>Сумма, €<input name="betrag" inputmode="decimal" placeholder="0,00" required></label>
      <div class="v-formpair">
        <label>Объект<select name="objekt"><option value="">—</option>
          ${(S.lage?.objekte||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}
        </select></label>
        <label id="fzg-label" style="display:none">Автомобиль<select name="fahrzeug"><option value="">—</option>
          ${(S.lage?.fahrzeuge||[]).map(f=>`<option value="${esc(f.id)}">${esc(f.kennzeichen)}</option>`).join('')}
        </select></label>
      </div>
      <label>Источник денег<select name="zahlungsweg">
        <option value="eigen">Свои деньги</option>
        <option value="vorschuss">Из аванса</option>
        <option value="firmenkarte">Карта фирмы</option>
      </select></label>
      <div class="v-upload" id="foto-upload-area">
        ${icon('camera')}<strong id="foto-status">Прикрепить фото чека</strong>
        <span class="v-small">Нажмите для выбора фото</span>
        <input type="file" id="foto-input" accept="image/*" capture="environment" style="position:absolute;opacity:0;inset:0;cursor:pointer">
      </div>
      <button type="submit" class="v-button primary full">Отправить на проверку</button>
    </form>`;
  } else if (mod==='neuerPlan') {
    title = 'Заявка на аванс';
    body = `<form id="plan-form" class="v-form">
      <label>Получатель<input name="empfaenger" placeholder="Имя сотрудника" required maxlength="120"></label>
      <label>Сумма, €<input name="betrag" inputmode="decimal" placeholder="0,00" required></label>
      <label>Назначение<input name="zweck" placeholder="Для чего нужны деньги" required maxlength="200"></label>
      <button type="submit" class="v-button primary full">Подать заявку</button>
    </form>`;
  } else if (mod==='ausgeben') {
    title = 'Выдача денег';
    const r = S.ausgewaehlt;
    const qt = r && (S.lage.quittungen||[]).find(q => q.plan_id === r.id && q.status === 'vorbereitet');
    body = qt ? `<form id="ausgabe-form" class="v-form">
      <input type="hidden" name="qt_id" value="${qt.id}">
      <div class="v-note">Деньги выдаются наличными. Квитанция оформляется сразу.</div>
      ${keys([['Получатель',qt.empfaenger||''],['Сумма',euro(qt.betrag)]])}
      <button type="submit" class="v-button primary full">Выдать и оформить квитанцию</button>
    </form>` : '<p class="v-note">Квитанция к этой заявке не найдена.</p>';
  } else if (mod==='rueckfrageNeu') {
    title = 'Задать вопрос';
    body = `<form id="rf-form" class="v-form">
      <label>Текст вопроса
        <textarea name="frage" rows="4" placeholder="Опишите, что нужно уточнить" required></textarea>
      </label>
      <button type="submit" class="v-button primary full">Создать запрос</button>
    </form>`;
  } else if (mod==='ablehnen') {
    title = 'Отклонить';
    body = `<form id="ablehnen-form" class="v-form">
      <label>Причина<textarea name="grund" rows="3" required></textarea></label>
      <button type="submit" class="v-button primary full" style="background:var(--v-red);color:var(--v-on);border-color:var(--v-red)">Отклонить</button>
    </form>`;
  } else if (mod==='eingangKlaeren') {
    title = 'Запросить уточнение';
    body = `<form id="ea-klaeren-form" class="v-form">
      <div class="v-note">Работник увидит этот текст в телефоне.</div>
      <label>Что нужно уточнить<textarea name="grund" rows="3" required></textarea></label>
      <button type="submit" class="v-button primary full">Запросить уточнение</button>
    </form>`;
  } else if (mod==='genehmigen') {
    title = 'Одобрить заявку';
    const halter = S.lage?.halter || [];
    body = `<form id="genehmigen-form" class="v-form">
      <div class="v-note">Выберите, кто будет выдавать деньги сотруднику.</div>
      <label>Кто выдаёт<select name="konto">
        <option value="hauptkasse">Основная касса · ${euro(S.lage?.kasse?.frei ?? S.lage?.kasse?.hauptkasse)} свободно</option>
        ${halter.map(h=>`<option value="${esc(h.id)}">${esc(h.name||h.login)}, директор · ${euro(h.frei)} свободно</option>`).join('')}
      </select></label>
      <button type="submit" class="v-button primary full">Одобрить и назначить кассира</button>
    </form>`;
  }
  if (mod==='metrikNalichnye') {
    title = 'Журнал наличных';
    const bew = (S.lage?.bewegungen||[]).slice().reverse();
    body = bew.length ? `<div class="v-ledger">
      ${bew.map(b=>`<button class="v-event cursor-interaction" data-action="bewegungDetail" data-bew-id="${b.id}" style="width:100%;text-align:left">
        ${icon('arrow-right-left')}
        <span style="flex:1">
          <span class="v-rowtitle">${esc(bewArt(b.art))}</span>
          <span class="v-small" style="display:block">${bewDatum(b)} · ${esc(b.von_name||'—')} → ${esc(b.an_name||'—')}</span>
        </span>
        <span class="v-num">${euro(b.betrag)} ${statusTag(b.status)}</span>
      </button>`).join('')}
    </div>` : '<div class="v-stateempty">Движений нет</div>';
  } else if (mod==='metrikReserviert') {
    title = 'Зарезервировано';
    const qt = S.lage?.quittungenVorbereitet||[];
    body = qt.length ? `<div class="v-note" style="margin-bottom:8px">Одобренные заявки с назначенным кассиром, ожидающие выдачи.</div>
      <div class="v-ledger">
        ${qt.map(q=>`<div class="v-event">
          ${icon('banknote')}
          <span style="flex:1">
            <span class="v-rowtitle">${esc(q.empfaenger||'—')}</span>
            <span class="v-small" style="display:block">${esc(q.nr||'')} · ${esc(q.plan_nr||'')}</span>
          </span>
          <span class="v-num">${euro(q.betrag)}</span>
        </div>`).join('')}
        <div class="v-event" style="font-weight:600;border-top:1px solid var(--v-brd);padding-top:8px">
          ${icon('sigma')}
          <span style="flex:1">Итого зарезервировано</span>
          <span class="v-num">${euro(qt.reduce((s,q)=>s+(q.betrag_cent||0),0))}</span>
        </div>
      </div>` : '<div class="v-stateempty">Активных резервов нет</div>';
  } else if (mod==='metrikFrei') {
    title = 'Свободный остаток';
    const k = S.lage?.kasse||{};
    const l = S.modalData && S.lage?.halter?.find(h=>h.login===S.modalData);
    const konto = l || k;
    const name = l ? (l.kurzname||l.name||l.login) : 'Основная касса';
    body = `<div class="v-ledger">
      <div class="v-event">${icon('wallet')}<span style="flex:1">${esc(name)} — наличные</span><span class="v-num">${euro(konto.hauptkasse??konto.saldo)}</span></div>
      <div class="v-event">${icon('lock')}<span style="flex:1">Зарезервировано</span><span class="v-num" style="color:var(--v-warn)">−${euro(konto.reserviert||0)}</span></div>
      <div class="v-event" style="font-weight:600;border-top:1px solid var(--v-brd);padding-top:8px">${icon('circle-check')}<span style="flex:1">Свободно для выдачи</span><span class="v-num" style="color:var(--v-ok)">${euro(konto.frei??konto.hauptkasse??konto.saldo)}</span></div>
    </div>
    <div class="v-note" style="margin-top:8px">Расчётный остаток по подтверждённым движениям.</div>`;
  } else if (mod==='metrikHalter') {
    title = 'Остаток директора';
    const h = S.lage?.halter?.find(x=>x.login===S.modalData);
    if (h) {
      body = `<div class="v-ledger">
        <div class="v-event">${icon('user')}<span style="flex:1">${esc(h.name||h.login)}</span><span class="v-num">${euro(h.saldo)}</span></div>
        <div class="v-event">${icon('lock')}<span style="flex:1">Зарезервировано</span><span class="v-num" style="color:var(--v-warn)">−${euro(h.reserviert||0)}</span></div>
        <div class="v-event" style="font-weight:600;border-top:1px solid var(--v-brd);padding-top:8px">${icon('circle-check')}<span style="flex:1">Свободно</span><span class="v-num" style="color:var(--v-ok)">${euro(h.frei)}</span></div>
        <div class="v-event">${icon('arrow-down-left')}<span style="flex:1">Всего получено</span><span class="v-num">${euro(h.erhalten)}</span></div>
        <div class="v-event">${icon('arrow-up-right')}<span style="flex:1">Всего выдано</span><span class="v-num">${euro(h.ausgaben)}</span></div>
        <div class="v-event">${icon('corner-up-left')}<span style="flex:1">Всего возвращено</span><span class="v-num">${euro(h.zurueck)}</span></div>
      </div>`;
    } else {
      body = '<div class="v-stateempty">Данные не найдены</div>';
    }
  } else if (mod==='bewegungDetail') {
    const b = (S.lage?.bewegungen||[]).find(x=>String(x.id)===String(S.modalData));
    if (b) {
      title = bewArt(b.art);
      const dok = bewDokInfo(b);
      let dokSection;
      if (b.art==='abhebung') {
        if (dok.bankLink) {
          dokSection = keys([
            ['Банковская транзакция', dok.bankLink.finmap_op ? `<span style="color:var(--v-ok,#2e7d32)">${icon('check-circle')} Привязана (${esc(dok.bankLink.finmap_op)})</span>` : `<span style="color:var(--v-ok,#2e7d32)">${icon('check-circle')} Привязана</span>`],
            ['Сумма в банке', dok.bankLink.op_betrag_cent != null ? euro(dok.bankLink.op_betrag_cent) : '—'],
            ['Статус', esc(dok.bankLink.status||'—')],
          ]);
        } else if (b.finmap_op) {
          dokSection = keys([['Код транзакции', `<span style="color:var(--v-ok,#2e7d32)">${icon('check-circle')} ${esc(b.finmap_op)}</span>`]]);
        } else {
          dokSection = `<div class="v-note" style="color:var(--v-warn,#e65100)">${icon('alert-circle')} Банковская транзакция не привязана</div>`;
        }
      } else {
        if (dok.hasBeleg) {
          dokSection = `<div class="v-note" style="color:var(--v-ok,#2e7d32)">${icon('paperclip')} Документ прикреплён</div>`;
        } else {
          dokSection = `<div class="v-note" style="color:var(--v-warn,#e65100)">${icon('alert-circle')} Документ не прикреплён</div>`;
        }
      }
      const isGf = S.ich?.rolle === 'gf';
      let transferSection = '';
      if (b.art === 'abhebung' && isGf) {
        const verteilte = (S.lage?.bewegungen||[])
          .filter(m => m.quelle_id === b.id && ['gemeldet','bestaetigt'].includes(m.status));
        const verteilt = verteilte.reduce((s, m) => s + (m.betrag||0), 0);
        const rest = Math.max(0, b.betrag - verteilt);
        const halterOpts = (S.lage?.halter||[]).map(h =>
          `<option value="${esc(h.id)}">${esc(h.kurzname||h.name||h.login)}</option>`).join('');
        const verteilListe = verteilte.length
          ? verteilte.map(m => `<div class="v-event">${icon('arrow-right-circle')}
              <span style="flex:1">${esc(m.an_name||'Касса')}</span>
              <span class="v-num">${euro(m.betrag)}</span>
              <span style="font-size:11px;margin-left:4px;color:${m.status==='bestaetigt'?'var(--v-ok,green)':'var(--v-warn,#e65100)'}">${m.status==='bestaetigt'?'✓':'⏳'}</span>
            </div>`).join('')
          : `<div class="v-note" style="color:var(--v-warn,#e65100)">${icon('alert-circle')} Ещё не передавалось в кассу</div>`;
        const restNote = rest > 0
          ? `<div class="v-note" style="margin-top:6px">Нераспределённый остаток: <strong>${euro(rest)}</strong></div>`
          : `<div class="v-note" style="color:var(--v-ok,green);margin-top:6px">${icon('check-circle')} Всё распределено</div>`;
        const kasseHasGeld = (S.lage?.kasse?.hauptkasse||0) > 0;
        const transferBlocked = rest > 0 && kasseHasGeld && verteilte.length === 0;
        const transferForm = rest > 0 && !transferBlocked ? `
          <form id="abhebung-transfer-form" data-bew-id="${b.id}" style="margin-top:12px;display:grid;gap:8px">
            <label style="display:grid;gap:4px;font-size:13px">Сумма (€)
              <input class="v-input" name="betrag" inputmode="decimal"
                value="${(rest/100).toFixed(2).replace('.',',')}" required>
            </label>
            <label style="display:grid;gap:4px;font-size:13px">Кому
              <select class="v-input" name="an_konto">
                <option value="hauptkasse">Касса VAV</option>
                ${halterOpts}
              </select>
            </label>
            <button type="submit" class="v-button primary full">${icon('arrow-right-circle')} ${t('transfer_btn')}</button>
          </form>` : '';
        const blockNote = transferBlocked ? `
          <div class="v-note" style="margin-top:8px;color:var(--v-warn,#e65100);background:var(--v-warn-bg,#fff8e1);padding:8px 10px;border-radius:6px">
            ${icon('lock')} В кассе ${euro(S.lage?.kasse?.hauptkasse||0)} нераспределённых денег — сначала распределите их, потом передавайте новое снятие.
            <button class="v-button" data-action="kasseAusgeben" style="margin-top:6px;width:100%;justify-content:center">${icon('send')} Распределить деньги</button>
          </div>` : '';
        transferSection = `
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--v-brd)">
            <div class="v-small" style="font-weight:600;margin-bottom:6px">Передача наличных</div>
            ${verteilListe}${restNote}${blockNote}${transferForm}
          </div>`;
      }
      const autoImportSection = b.abhebung_bestaetigen_darf ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--v-brd);background:var(--v-warn-bg,#fff8e1);border-radius:8px;padding:12px">
          <div class="v-small" style="font-weight:600;margin-bottom:8px;color:var(--v-warn,#e65100)">${icon('alert-circle')} Автоимпорт — требует подтверждения</div>
          <div class="v-note" style="margin-bottom:10px;font-size:12px">Это снятие обнаружено автоматически в FinMap. Проверьте сумму и дату по банковской выписке.</div>
          <div style="display:flex;gap:8px">
            <button class="v-button primary" style="flex:1;justify-content:center" data-action="abhebungBestaetigen" data-id="${b.id}">${icon('check-circle')} Подтвердить</button>
            <button class="v-button" style="flex:1;justify-content:center;color:var(--v-err,#c62828)" data-action="abhebungAblehnen" data-id="${b.id}">${icon('x-circle')} Отклонить</button>
          </div>
        </div>` : '';
      body = `<div class="v-ledger">
        ${keys([
          ['Тип', esc(bewArt(b.art))],
          ['Дата', bewDatum(b)],
          ['Сумма', euro(b.betrag)],
          ['Откуда', b.von_name ? esc(b.von_name) : null],
          ['Куда', b.an_name ? esc(b.an_name) : null],
          ['Статус', statusTag(b.status)],
          b.notiz ? ['Примечание', esc(b.notiz)] : null,
        ])}
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--v-brd)">
        <div class="v-small" style="font-weight:600;margin-bottom:6px">Документ</div>
        ${dokSection}
      </div>${autoImportSection}${transferSection}${
        (b.art==='uebergabe' && b.status==='gemeldet' && isGf) ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--v-brd)">
        <button class="v-button" style="width:100%;justify-content:center;color:var(--v-err,#c62828)" data-action="bewegungStornieren" data-id="${b.id}">${icon('x-circle')} Отменить передачу</button>
      </div>` : ''}`;
    } else {
      title = 'Движение';
      body = '<div class="v-stateempty">Данные не найдены</div>';
    }
  } else if (mod==='kasseAusgeben') {
    if (S.signaturStep) {
      title = 'Документ · ' + esc(S.signaturStep.nr);
      body = `
        <div class="v-note" style="margin-bottom:12px">${icon('file-text')} <strong>${esc(S.signaturStep.nr)}</strong> · ${esc(S.signaturStep.empfaenger||'')} · <strong>${euro(S.signaturStep.betrag||0)}</strong></div>
        <div style="background:var(--v-warn-bg,#fff8e1);border:1px solid var(--v-warn,#e65100);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px;color:var(--v-warn,#e65100)">
          ${icon('alert-triangle')} <strong>Beide Unterschriften erforderlich.</strong> Erst Empfänger, dann Kassierer unterschreiben.
        </div>
        <div class="v-small" style="margin-bottom:4px;font-weight:600">1. Unterschrift Empfänger</div>
        <canvas id="sig-canvas" width="700" height="120"
          style="width:100%;border:2px solid var(--v-brd);border-radius:8px;touch-action:none;cursor:crosshair;background:#fff;display:block"></canvas>
        <div style="display:flex;gap:8px;margin-top:6px;margin-bottom:14px">
          <button type="button" id="sig-clear" class="v-button" style="flex:0 0 auto">${icon('eraser')} Löschen</button>
          <span style="flex:1;font-size:12px;color:var(--v-muted);align-self:center">Empfänger unterschreibt hier</span>
        </div>
        <div class="v-small" style="margin-bottom:4px;font-weight:600">2. Unterschrift Kassierer (Ausgezahlt von)</div>
        <canvas id="sig-canvas-ausgabe" width="700" height="120"
          style="width:100%;border:2px solid var(--v-brd);border-radius:8px;touch-action:none;cursor:crosshair;background:#fff;display:block"></canvas>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button type="button" id="sig-clear-ausgabe" class="v-button" style="flex:0 0 auto">${icon('eraser')} Löschen</button>
          <span style="flex:1;font-size:12px;color:var(--v-muted);align-self:center">Kassierer unterschreibt hier</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button type="button" id="sig-save" class="v-button primary" style="flex:1">${icon('check-circle')} Beide unterschrieben – Geld auszahlen</button>
        </div>
        <div style="margin:14px 0 6px;font-size:13px;color:var(--v-muted);text-align:center">— oder nur Foto —</div>
        <div class="v-small" style="margin-bottom:6px;font-weight:600">Foto der Quittung</div>
        <div id="chek-area" class="v-upload" style="padding:14px 12px;position:relative">
          ${icon('paperclip')}<strong id="chek-status">Quittung / Foto anhängen</strong>
          <span class="v-small">Foto oder PDF</span>
          <input type="file" id="chek-input" accept="image/*,application/pdf" capture="environment" style="position:absolute;opacity:0;inset:0;cursor:pointer">
        </div>
        <button type="button" id="chek-ausgeben" class="v-button primary full" style="display:none;margin-top:8px">${icon('send')} Auszahlen per Quittungsfoto</button>
        <button type="button" id="sig-abbrechen" class="v-button" style="width:100%;margin-top:14px;justify-content:center;color:var(--v-muted);font-size:13px">${icon('x-circle')} Auszahlung abbrechen</button>`;
    } else {
    title = 'Распределить деньги';
    const hauptkasse = S.lage?.kasse?.hauptkasse || 0;
    const frei = S.lage?.kasse?.frei ?? hauptkasse;
    const kasseAT = (S.lage?.auftragnehmer||[]).map(a =>
      `<option value="at:${a.id}|${esc(a.name)}">${esc(a.name)}${a.art==='person'?' (физ.)':''}</option>`
    ).join('');
    const kasseNames = new Set((S.lage?.auftragnehmer||[]).map(a => a.name.toLowerCase()));
    const vavNuOpts = (S.lage?.vavapp_nu||[])
      .filter(nu => !kasseNames.has(nu.name.toLowerCase()))
      .map(nu => `<option value="${esc(nu.id)}|${esc(nu.name)}">${esc(nu.name)} (из учёта часов)</option>`)
      .join('');
    const auftragnehmerOpts = [
      kasseAT ? `<optgroup label="Подрядчики (касса)">${kasseAT}</optgroup>` : '',
      vavNuOpts ? `<optgroup label="Подрядчики (учёт часов)">${vavNuOpts}</optgroup>` : '',
    ].join('');
    const personenOpts = (S.lage?.personen||[]).map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    body = `
      <div class="v-note" style="margin-bottom:12px">${icon('wallet')} В кассе: <strong>${euro(hauptkasse)}</strong> · Свободно: <strong>${euro(frei)}</strong></div>
      <div class="v-upload" id="ocr-upload-area" style="margin-bottom:12px;padding:10px 12px;cursor:pointer;position:relative">
        ${icon('camera')}<strong id="ocr-status">Сфотографировать квитанцию</strong>
        <span class="v-small" style="margin-top:2px">Сумма и получатель заполнятся автоматически</span>
        <input type="file" id="ocr-input" accept="image/*" capture="environment" style="position:absolute;opacity:0;inset:0;cursor:pointer">
      </div>
      <form id="kasse-ausgeben-form" class="v-form">
        <label>Назначение
          <select name="kategorie" id="ag-kategorie" required>
            <optgroup label="— Аванс —">
              <option value="vorschuss|">Аванс (общий)</option>
              <option value="vorschuss|Бензин / Kraftstoff">Аванс · Бензин</option>
              <option value="vorschuss|Werkzeug / Инструменты">Аванс · Инструменты</option>
              <option value="vorschuss|Material / Материалы">Аванс · Материалы</option>
            </optgroup>
            <optgroup label="— Выплаты —">
              <option value="lohn|">Зарплата / выплата</option>
              <option value="lohn|Оплата подрядчика">Оплата подрядчика</option>
            </optgroup>
            <optgroup label="— Прочее —">
              <option value="erstattung|">Возврат расходов</option>
            </optgroup>
          </select>
        </label>
        <div id="ag-label-text" style="display:grid;gap:6px">
          <span style="font-size:12px;color:var(--v-sub)">Кому</span>
          <select id="ag-empfaenger-sel">
            <option value="">— Выберите получателя —</option>
            ${personenOpts}
            <option value="__manual__">✏ Ввести вручную…</option>
          </select>
          <input id="ag-empfaenger-manual" placeholder="Имя получателя" style="display:none">
          <input type="hidden" name="empfaenger_name" id="ag-empfaenger-text">
        </div>
        <div id="ag-label-select" style="display:none">
          <label>Подрядчик
            <select id="ag-auftragnehmer-sel">
              ${auftragnehmerOpts}
              <option value="__new__">＋ Добавить нового…</option>
            </select>
          </label>
          <div id="ag-new-form" style="display:none;flex-direction:column;gap:8px;background:var(--v-bg2,#f5f5f5);border-radius:8px;padding:10px;margin-top:6px">
            <label style="margin:0">Название фирмы / имя
              <input id="ag-new-name" placeholder="Firma GmbH" maxlength="200">
            </label>
            <div style="display:flex;gap:8px">
              <label style="margin:0;flex:1">Тип
                <select id="ag-new-art">
                  <option value="firma">Фирма</option>
                  <option value="person">Физ. лицо</option>
                </select>
              </label>
            </div>
            <button type="button" id="ag-new-save" class="v-button primary">${icon('user-plus')} Сохранить подрядчика</button>
          </div>
          <input type="hidden" name="empfaenger_name" id="ag-empfaenger-hidden" disabled>
        </div>
        <label>Rechnungs-Nr. (необязательно)
          <input name="rechnungs_nr" id="ag-rechnungs-nr" placeholder="2024-001" maxlength="50">
        </label>
        <label>Сумма (€)
          <input name="betrag" id="ag-betrag" inputmode="decimal" placeholder="0,00" required>
        </label>
        <label>Примечание
          <input name="notiz" placeholder="Необязательно (автозаполнится по назначению)">
        </label>
        <button type="submit" class="v-button primary full">${icon('send')} Выдать →</button>
      </form>`;
    } // end else (not signaturStep)
  } else if (mod==='zaehlen') {
    title = 'Пересчёт наличных';
    const isDisp = S.ich?.rolle === 'disponent';
    const h = isDisp ? (S.lage?.halter||[]).find(x=>x.login===S.ich?.login) : null;
    const saldo = isDisp && h ? h.saldo : (S.lage?.kasse?.hauptkasse||0);
    body = `<form id="zaehlen-form" class="v-form">
      <div class="v-note">По журналу: <strong>${euro(saldo)}</strong>. Введите фактически пересчитанную сумму.</div>
      <label>Пересчитано, €<input name="betrag" inputmode="decimal" placeholder="0,00" required autofocus></label>
      <div id="zaehlen-diff" style="display:none;padding:8px;border-radius:6px;margin-top:4px"></div>
      <button type="submit" class="v-button primary full">Записать пересчёт</button>
    </form>`;
  }
  return `<section class="v-modal">
    <div class="v-modalheader"><h3>${esc(title)}</h3>
      <button class="v-button" data-action="modalClose" aria-label="${t('modal_close')}">${icon('x')}</button>
    </div>${body}
  </section>`;
}

/* ---------- Сборка страницы ---------- */
function istMobil() { return window.innerWidth < 620; }

function closeModal() { S.modal = null; S.modalData = null; }

function renderApp() {
  if (!S.ich) return;
  const r = S.ich.rolle;
  const isMa = r === 'mitarbeiter';
  const isDisp = r === 'disponent';
  const isBuch = r === 'buchhaltung' || r === 'gf';

  const navLinks = isMa ? [
    ['mein','house',t('nav_mein')],
    ['quittungen','receipt',t('nav_quittungen')],
    ['rueckfragen','message-circle',t('nav_fragen')],
  ] : isDisp ? [
    ['lage','wallet',t('nav_kasse')],
    ['eingang','inbox',t('nav_avans')],
    ['quittungen','receipt',t('nav_quittungen')],
    ['rueckfragen','message-circle',t('nav_fragen')],
  ] : [
    ['lage','layout-dashboard',t('nav_desk')],
    ['eingang','inbox',t('nav_eingang')],
    ['kasse','wallet',t('nav_kasse')],
    ['quittungen','receipt',t('nav_quittungen')],
    ['rueckfragen','message-square',t('nav_req')],
  ];

  let hauptinhalt = '';
  if (S.seite==='lage') hauptinhalt = renderLage();
  else if (S.seite==='eingang') hauptinhalt = renderEingang();
  else if (S.seite==='kasse') hauptinhalt = renderKasse();
  else if (S.seite==='rueckfragen') hauptinhalt = renderRueckfragen();
  else if (S.seite==='mein') hauptinhalt = renderMeinBereich();
  else if (S.seite==='quittungen') hauptinhalt = renderQuittungen();
  else hauptinhalt = renderLage();

  const syncInfo = S.sync.wann
    ? `<span class="v-sync${S.sync.ok?'':' err'}">${icon(S.sync.ok?'check':'alert-circle')}${S.sync.wann.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span>`
    : '';

  const app = document.getElementById('app');
  app.innerHTML = `
<div class="wrap">
<div class="v-app">
  <header class="v-top">
    <div class="v-logo"><span class="v-mark">₽</span>${t('header')}</div>
    <span class="v-tag">${esc(S.lage?.firma||'VAV Kaiser GmbH')}</span>
    <div class="v-topright">
      ${syncInfo}
      <button class="v-button small" data-action="switchLang" title="Sprache / Язык" style="font-size:11px;padding:2px 8px;min-width:32px">${t('lang_btn')}</button>
      <span class="v-small">${esc(S.ich.name||S.ich.login)}</span>
      <span class="v-avatar" data-action="logout" title="${t('logout')}">${esc((S.ich.name||S.ich.login).slice(0,2).toUpperCase())}</span>
    </div>
  </header>
  <div class="v-layout">
    <nav class="v-sidebar">
      ${navLinks.map(([id,ico,t])=>`
      <button class="${S.seite===id?'active':''}" data-nav="${id}">
        ${icon(ico)}${t}
        ${id==='rueckfragen'&&(S.lage?.rueckfragen_offen||0)>0?`<span class="v-count">${S.lage.rueckfragen_offen}</span>`:''}
        ${id==='eingang'&&(S.lage?.eingang_anzahl||0)>0?`<span class="v-count">${S.lage.eingang_anzahl}</span>`:''}
      </button>`).join('')}
      <div class="v-sidebarfoot">${t('sidebar_foot')}<br>${new Date().toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</div>
    </nav>
    <main class="v-content">
      ${hauptinhalt}
      ${S.modal ? renderModal(S.modal) : ''}
      <div class="v-footer">
        <span>${t('sidebar_foot')} · ${esc(S.ich.name||S.ich.login)}</span>
        <span>${t('beweg_work')}</span>
      </div>
    </main>
  </div>
</div>
</div>`;

  if (window.lucide) lucide.createIcons();
  setupSigCanvas();
  setupAusgebenForm();
}

function setupAusgebenForm() {
  const kat = document.getElementById('ag-kategorie');
  if (!kat) return;

  function updateEmpfRow() {
    const isAt = kat.value === 'lohn|Оплата подрядчика';
    const labelText = document.getElementById('ag-label-text');
    const labelSel = document.getElementById('ag-label-select');
    const hidPerson = document.getElementById('ag-empfaenger-text');
    const hidAt = document.getElementById('ag-empfaenger-hidden');
    if (!labelText || !labelSel) return;
    if (isAt) {
      labelText.style.display = 'none';
      if (hidPerson) hidPerson.disabled = true;
      if (hidAt) hidAt.disabled = false;
      labelSel.style.display = '';
      syncHidden();
      const sel = document.getElementById('ag-auftragnehmer-sel');
      const newForm = document.getElementById('ag-new-form');
      if (sel && newForm && sel.value === '__new__') newForm.style.display = 'flex';
    } else {
      labelText.style.display = 'grid';
      if (hidPerson) hidPerson.disabled = false;
      if (hidAt) hidAt.disabled = true;
      labelSel.style.display = 'none';
    }
  }

  function syncHidden() {
    const sel = document.getElementById('ag-auftragnehmer-sel');
    const hid = document.getElementById('ag-empfaenger-hidden');
    if (!sel || !hid) return;
    if (sel.value === '__new__') { hid.value = ''; }
    else { const parts = sel.value.split('|'); hid.value = parts.slice(1).join('|') || ''; }
  }

  kat.addEventListener('change', updateEmpfRow);
  updateEmpfRow();

  // Person-select listeners
  const empfSel = document.getElementById('ag-empfaenger-sel');
  const empfManual = document.getElementById('ag-empfaenger-manual');
  const empfHid = document.getElementById('ag-empfaenger-text');
  function syncEmpf() {
    if (!empfSel) return;
    if (empfSel.value === '__manual__') {
      if (empfManual) empfManual.style.display = '';
      if (empfHid) empfHid.value = empfManual?.value || '';
    } else {
      if (empfManual) empfManual.style.display = 'none';
      if (empfHid) empfHid.value = empfSel.value;
    }
  }
  if (empfSel) empfSel.addEventListener('change', () => { syncEmpf(); if (empfSel.value === '__manual__') empfManual?.focus(); });
  if (empfManual) empfManual.addEventListener('input', () => { if (empfHid) empfHid.value = empfManual.value; });

  const atSel = document.getElementById('ag-auftragnehmer-sel');
  if (atSel) {
    atSel.addEventListener('change', () => {
      syncHidden();
      const newForm = document.getElementById('ag-new-form');
      if (newForm) newForm.style.display = atSel.value === '__new__' ? 'flex' : 'none';
    });
  }

  const saveBt = document.getElementById('ag-new-save');
  if (saveBt) {
    saveBt.addEventListener('click', async () => {
      const name = (document.getElementById('ag-new-name')?.value||'').trim();
      const art = document.getElementById('ag-new-art')?.value || 'firma';
      if (!name) { toast('Введите название'); return; }
      try {
        saveBt.disabled = true;
        const r = await api('POST','auftragnehmer',{name,art});
        if (!S.lage) S.lage = {};
        if (!S.lage.auftragnehmer) S.lage.auftragnehmer = [];
        S.lage.auftragnehmer.push({id:r.id,name:r.name,art,iban:null,notiz:null});
        S.lage.auftragnehmer.sort((a,b)=>a.name.localeCompare(b.name,'de'));
        const sel = document.getElementById('ag-auftragnehmer-sel');
        if (sel) {
          const opt = document.createElement('option');
          opt.value = 'at:' + r.id + '|' + r.name;
          opt.textContent = r.name + (art==='person'?' (физ.)':'');
          sel.insertBefore(opt, sel.querySelector('option[value="__new__"]'));
          sel.value = opt.value;
          document.getElementById('ag-new-form').style.display = 'none';
          syncHidden();
        }
        toast('Подрядчик добавлен: ' + r.name);
      } catch(e) { toast('Ошибка: ' + e.message); } finally { saveBt.disabled = false; }
    });
  }

  const ocrInput = document.getElementById('ocr-input');
  if (ocrInput) {
    ocrInput.addEventListener('change', async () => {
      const file = ocrInput.files[0]; if (!file) return;
      const status = document.getElementById('ocr-status');
      if (status) status.textContent = 'Распознаю…';
      try {
        const buf = await file.arrayBuffer();
        const resp = await fetch('/api/k/beleg-scan', {
          method:'POST', headers:{'Content-Type': file.type},
          body: buf, credentials: 'same-origin'
        });
        const r = await resp.json();
        if (r.betrag != null) {
          const betragEl = document.getElementById('ag-betrag');
          if (betragEl) betragEl.value = String(r.betrag).replace('.',',');
        }
        if (r.empfaenger) {
          if (document.getElementById('ag-label-text')?.style.display !== 'none') {
            const sel = document.getElementById('ag-empfaenger-sel');
            const man = document.getElementById('ag-empfaenger-manual');
            const hid = document.getElementById('ag-empfaenger-text');
            if (sel) sel.value = '__manual__';
            if (man) { man.style.display = ''; man.value = r.empfaenger; }
            if (hid) hid.value = r.empfaenger;
          } else {
            const hidEl = document.getElementById('ag-empfaenger-hidden');
            if (hidEl) hidEl.value = r.empfaenger;
          }
        }
        if (status) status.textContent = r.betrag ? ('Распознано: ' + euro(Math.round(r.betrag*100))) : 'Квитанция загружена';
      } catch(e) { if (status) status.textContent = 'Ошибка распознавания'; }
    });
  }
}

/* ---------- Обработка форм ---------- */
async function formAbsenden(form) {
  const fd = new FormData(form);
  const d = Object.fromEntries([...fd.entries()]);
  const parseEur = s => Math.round(Number(String(s||'0').replace(',','.')) * 100);

  try {
    if (form.id==='abhebung-form') {
      S.abhPending = { betrag: parseEur(d.betrag), notiz: d.notiz||'', datum: d.datum||'' };
      await api('POST','abhebung', S.abhPending);
      S.abhPending = null; S.modal = null;
      await lageLaden(); toast('Снятие записано'); renderApp();
    } else if (form.id==='uebergabe-form') {
      await api('POST','uebergabe',{an_konto: d.an_konto, betrag: parseEur(d.betrag)});
      toast('Übergabe erstellt');
    } else if (form.id==='einzahlung-form') {
      await api('POST','einzahlung',{betrag: parseEur(d.betrag), datum: d.datum||'', grund: d.grund||'sonstiges', person: d.person||'', notiz: d.notiz||''});
      S.modal = null;
      await lageLaden(); toast('Einzahlung erfasst'); renderApp(); return;
    } else if (form.id==='beleg-form') {
      await api('POST','beleg',{betrag: parseEur(d.betrag), art: d.art||'sonstig', objekt: d.objekt||null, fahrzeug: d.fahrzeug||null, zahlungsweg: d.zahlungsweg||'eigen'});
      toast('Чек отправлен на проверку');
    } else if (form.id==='plan-form') {
      await api('POST','plan/einfach',{betrag: parseEur(d.betrag), zweck: d.zweck||'', person_name: d.empfaenger||''});
      toast('Заявка на аванс подана');
    } else if (form.id==='ausgabe-form') {
      const qtId = d.qt_id;
      if (qtId) await api('POST',`quittung/${qtId}/ausgeben`,{});
      toast('Квитанция оформлена, деньги выданы');
    } else if (form.id==='rf-form') {
      const r = S.ausgewaehlt;
      if (r) await api('POST','rueckfrage',{beleg_ref: r.ref||String(r.id), frage: d.frage});
      toast('Вопрос создан');
    } else if (form.id==='ablehnen-form') {
      const r = S.ausgewaehlt;
      if (r) {
        if (r._typ === 'ea') {
          await api('POST', `eingang/${r.id}/ablehnen`, {grund: d.grund});
          toast('Запрос отклонён'); S.ausgewaehlt = null;
        } else {
          const pfad = r.plan_ref ? `plan/${r.id}/entscheiden` : `beleg/${r.id}/pruefen`;
          await api('POST', pfad, {aktion:'ablehnen', grund: d.grund});
          toast('Документ отклонён');
        }
      }
    } else if (form.id==='ea-klaeren-form') {
      const r = S.ausgewaehlt;
      if (r) { await api('POST', `eingang/${r.id}/klaeren`, {grund: d.grund}); toast('Запрос на уточнение отправлен'); }

    } else if (form.id==='genehmigen-form') {
      const r = S.ausgewaehlt;
      if (r) {
        await api('POST', `plan/${r.id}/entscheiden`, {konto: d.konto});
        toast('Заявка одобрена. Выдающий назначен.');
        S.ausgewaehlt = null;
      }
    } else if (form.id==='kasse-ausgeben-form') {
      const [zweck, defaultNotiz] = (d.kategorie || 'vorschuss|').split('|');
      const rNr = (d.rechnungs_nr || '').trim();
      const baseNotiz = d.notiz || defaultNotiz || '';
      const notiz = (rNr ? ('R.-Nr.: ' + rNr + (baseNotiz ? ' · ' + baseNotiz : '')) : baseNotiz) || undefined;
      const betrag = parseEur(d.betrag);
      const empfaenger_name = d.empfaenger_name === '__manual__'
        ? (document.getElementById('ag-empfaenger-manual')?.value || '').trim()
        : d.empfaenger_name;
      const r = await api('POST', 'quittung/dringend', { zweck, empfaenger_name, betrag, notiz });
      S.signaturStep = { id: r.id, nr: r.nr, empfaenger: empfaenger_name, betrag };
      await lageLaden();
      renderApp();
      document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
      return;
    } else if (form.id==='abhebung-transfer-form') {
      const bewId = form.dataset.bewId;
      await api('POST','uebergabe',{quelle_id: Number(bewId), an_konto: d.an_konto, betrag: parseEur(d.betrag)});
      toast('Деньги переданы в кассу');
    } else if (form.id==='zaehlen-form') {
      const isDisp = S.ich?.rolle === 'disponent';
      const h = isDisp ? (S.lage?.halter||[]).find(x=>x.login===S.ich?.login) : null;
      const saldo = isDisp && h ? h.saldo : (S.lage?.kasse?.hauptkasse||0);
      const eingabe = Math.round(parseFloat(d.betrag.replace(',','.')) * 100);
      const diff = eingabe - saldo;
      const diffEl = document.getElementById('zaehlen-diff');
      if (diffEl) {
        const ok = diff === 0;
        diffEl.style.display = '';
        diffEl.style.background = ok ? 'var(--v-ok-bg,#e8f5e9)' : 'var(--v-warn-bg,#fff8e1)';
        diffEl.style.color = ok ? 'var(--v-ok,green)' : 'var(--v-warn,#e65100)';
        diffEl.textContent = ok
          ? 'Расхождений нет. По журналу: ' + euro(saldo)
          : 'Расхождение: ' + (diff > 0 ? '+' : '') + euro(Math.abs(diff)) + (diff > 0 ? ' излишек' : ' недостача') + '. По журналу: ' + euro(saldo);
      }
      return; // не закрывать модал, не перезагружать
    }
    S.modal = null;
    await lageLaden();
    renderApp();
  } catch (e) {
    // Слой 2: 409 от abhebung — показываем предупреждение о дубликате
    if (e.status === 409 && S.abhPending) {
      S.abhDupWarn = { msg: e.message, ...S.abhPending };
      S.abhPending = null;
      renderApp();
      document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
    } else {
      S.abhPending = null;
      toast(e.message, 'err');
    }
  }
}

/* ---------- Нажатия ---------- */
document.getElementById('app').addEventListener('click', async e => {
  const b = e.target.closest('[data-action],[data-nav],[data-record],[data-filter],[data-plantab]');
  if (!b) return;

  if (b.dataset.nav) {
    S.seite = b.dataset.nav;
    S.modal = null;
    S.ausgewaehlt = null;
    renderApp();
    return;
  }

  if (b.dataset.filter) {
    S.filter = b.dataset.filter;
    renderApp();
    return;
  }

  if (b.dataset.plantab) {
    S.planTab = b.dataset.plantab;
    S.ausgewaehlt = null;
    renderApp();
    return;
  }

  if (b.dataset.record) {
    const typ = b.dataset.typ;
    const ref = b.dataset.record;
    if (typ==='plan') {
      S.ausgewaehlt = (S.lage?.plaene_offen||[]).find(p=>p.ref===ref) || (S.lage?.meine_plaene||[]).find(p=>p.ref===ref);
    } else if (typ==='beleg') {
      S.ausgewaehlt = (S.lage?.belege_queue||[]).find(b=>String(b.id)===ref) || (S.lage?.meine_belege||[]).find(b=>String(b.id)===ref);
    } else if (typ==='rueckfrage') {
      S.ausgewaehlt = (S.lage?.rueckfragen||[]).find(r=>String(r.id)===ref);
    } else if (typ==='ea') {
      S.ausgewaehlt = (S.lage?.eingaenge||[]).find(e=>String(e.id)===ref);
      if (S.ausgewaehlt) S.ausgewaehlt = { ...S.ausgewaehlt, _typ: 'ea' };
    }
    S.modal = null;
    renderApp();
    return;
  }

  const act = b.dataset.action;
  if (!act) return;

  if (act==='logout') {
    await fetch('/api/logout', {method:'POST', credentials:'same-origin'});
    window.location.reload();
    return;
  }
  if (act==='modalClose') {
    if (S.signaturStep) {
      // Квитанция vorbereitet — деньги ещё не выданы. Спрашиваем перед отменой.
      if (!confirm('Выдача не завершена. Отменить квитанцию ' + S.signaturStep.nr + '?')) return;
      try { await api('POST', 'quittung/' + S.signaturStep.id + '/abbrechen', {}); } catch(e) { /* игнорируем */ }
    }
    S.modal = null; S.modalData = null; S.signaturStep = null; await lageLaden(); renderApp(); return;
  }

  const scrollToModal = () => document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
  if (act==='abhebungBestaetigen') {
    try {
      await api('POST', `abhebung/${b.dataset.id}/bestaetigen`, {});
      await lageLaden(); closeModal(); toast('Снятие подтверждено'); renderApp();
    } catch(e) { toast(e.message, 'err'); }
    return;
  }
  if (act==='abhebungAblehnen') {
    try {
      await api('POST', `abhebung/${b.dataset.id}/ablehnen`, {});
      await lageLaden(); closeModal(); toast('Снятие отклонено'); renderApp();
    } catch(e) { toast(e.message, 'err'); }
    return;
  }

  if (act==='bewegungStornieren') {
    if (!confirm('Отменить эту передачу наличных?')) return;
    try {
      await api('POST', `bewegung/${b.dataset.id}/stornieren`, {});
      await lageLaden(); closeModal(); toast('Передача отменена'); renderApp();
    } catch(e) { toast(e.message, 'err'); }
    return;
  }

  if (act==='metrikNalichnye' || act==='kasseAusgeben') {
    const isGf = S.ich?.rolle === 'gf';
    const kasseHasGeld = (S.lage?.kasse?.hauptkasse||0) > 0;
    S.modal = (act==='kasseAusgeben' || (isGf && kasseHasGeld)) ? 'kasseAusgeben' : 'metrikNalichnye';
    renderApp(); scrollToModal(); return;
  }
  if (act==='metrikReserviert') { S.modal = 'metrikReserviert'; renderApp(); scrollToModal(); return; }
  if (act==='metrikFrei') { S.modalData = null; S.modal = 'metrikFrei'; renderApp(); scrollToModal(); return; }
  if (act==='metrikHalter') {
    S.modalData = b.dataset.login || null;
    S.modal = 'metrikHalter';
    renderApp();
    scrollToModal();
    return;
  }
  if (act==='switchLang') {
    S.lang = S.lang === 'ru' ? 'de' : 'ru';
    try { localStorage.setItem('v_lang', S.lang); } catch(e) {}
    renderApp();
    return;
  }
  if (act==='zaehlenNalichnye') { S.modal = 'zaehlen'; renderApp(); scrollToModal(); return; }
  if (act==='druckenAlle') {
    const isDisp = S.ich?.rolle === 'disponent';
    const myLogin = S.ich?.login;
    const qt = (S.lage?.quittungenVorbereitet||[]).filter(q => !isDisp || q.von_konto === 'halter:'+myLogin);
    qt.forEach(q => window.open('/api/k/quittung/'+q.id+'/druck', '_blank'));
    return;
  }
  if (['hauptkasse','halterSaldo','offeneRueckfragen'].includes(act)) {
    if (act === 'offeneRueckfragen') { S.seite = 'rueckfragen'; S.modal = null; }
    else if (act === 'hauptkasse') S.modal = 'metrikNalichnye';
    else if (act === 'halterSaldo') { S.modalData = b.dataset.login||null; S.modal = 'metrikHalter'; }
    renderApp();
    return;
  }

  if (act==='belegPruefen') {
    const r = S.ausgewaehlt;
    if (r) { await api('POST',`beleg/${r.id}/pruefen`,{aktion:'geprueft'}); await lageLaden(); toast('Чек принят'); renderApp(); }
    return;
  }
  if (act==='planEinreichen') {
    const r = S.ausgewaehlt;
    if (r) {
      try { await api('POST',`plan/${r.id}/einreichen`,{}); await lageLaden(); toast('Заявка подана на одобрение'); S.ausgewaehlt = null; renderApp(); }
      catch(e) { toast(e.message,'err'); }
    }
    return;
  }
  if (act==='planBewilligen') {
    S.modal = 'genehmigen';
    renderApp();
    document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
  if (act==='quittungDrucken') {
    const qtId = b.dataset.qtId;
    if (qtId) window.open('/api/k/quittung/'+qtId+'/druck', '_blank');
    return;
  }
  if (act==='quittungAusgeben') {
    const qtId = b.dataset.qtId;
    if (!qtId) return;
    try { await api('POST',`quittung/${qtId}/ausgeben`,{}); await lageLaden(); toast('Деньги выданы. Квитанция оформлена.'); renderApp(); }
    catch(e) { toast(e.message,'err'); }
    return;
  }
  if (act==='quittungOriginalOk') {
    const qtId = b.dataset.qtId;
    if (!qtId) return;
    try { await api('POST',`quittung/${qtId}/original`,{}); await lageLaden(); toast('Оригинал получен.'); renderApp(); }
    catch(e) { toast(e.message,'err'); }
    return;
  }
  if (act==='eingangBewilligen') {
    const r = S.ausgewaehlt;
    if (r) {
      try { await api('POST',`eingang/${r.id}/bewilligen`,{}); await lageLaden(); toast('Запрос одобрен'); S.ausgewaehlt = null; renderApp(); }
      catch(e) { toast(e.message,'err'); }
    }
    return;
  }
  if (act==='eingangAblehnen') {
    S.modal = 'ablehnen';
    renderApp();
    scrollToModal();
    return;
  }
  if (act==='eingangKlaeren') {
    S.modal = 'eingangKlaeren';
    renderApp();
    scrollToModal();
    return;
  }
  if (act==='fotoOeffnen') {
    window.open('/api/k/datei/'+b.dataset.sha, '_blank');
    return;
  }
  if (act==='inKasse') {
    const bewId = b.dataset.bewId;
    const bewBetrag = Number(b.dataset.bewBetrag);
    if (bewId) {
      try {
        await api('POST','uebergabe',{quelle_id: Number(bewId), an_konto: 'hauptkasse', betrag: bewBetrag});
        await lageLaden(); toast('Деньги записаны в кассу'); renderApp();
      } catch(e) { toast(e.message,'err'); }
    }
    return;
  }

  if (act==='abhDupCancel') {
    S.abhDupWarn = null;
    S.modal = null;
    renderApp();
    return;
  }
  if (act==='abhDupForce') {
    try {
      const w = S.abhDupWarn;
      S.abhDupWarn = null;
      await api('POST','abhebung',{ betrag: w.betrag, notiz: w.notiz, datum: w.datum, force: true });
      S.modal = null;
      await lageLaden(); toast('Снятие записано'); renderApp();
    } catch(e2) { toast(e2.message,'err'); }
    return;
  }

  if (act==='bewegungDetail') {
    S.modalData = b.dataset.bewId || null;
    S.modal = 'bewegungDetail';
    renderApp();
    document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }

  // Модальные окна.
  if (['neueUebergabe','neuerBeleg','neuerPlan','ausgeben','rueckfrageNeu','ablehnen','neueAbhebung','kasseSverka'].includes(act)) {
    S.modal = act;
    renderApp();
    document.querySelector('.v-modal')?.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
});

async function init() {

  try {
    const r = await fetch('/api/ich', {credentials:'same-origin'});

      loading.hidden = true;
      loginPage.classList.add('show');
      return;
    }
    S.ich = await r.json();
    S.seite = S.ich.rolle==='mitarbeiter' ? 'mein' : S.ich.rolle==='disponent' ? 'lage' : 'lage';
    await lageLaden();

  } catch (err) {
    loading.textContent = 'Ошибка: ' + err.message;
  }

      body: JSON.stringify({login: fd.get('login'), pin: fd.get('pin')}),

    err.textContent = ex.message;

  }
});
