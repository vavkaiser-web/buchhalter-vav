<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buchhalter VAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   Buchhalter VAV — светлая тема по умолчанию.
   Бумага тёплая, чернила синие как на строительном чертеже,
   красный/жёлтый/зелёный оставлены только под смысл: критично,
   проверить, в порядке. Синий поэтому нигде не значит «состояние».
   ---------------------------------------------------------------- */
:root{
  --ground:#EBE7DF; --surface:#FCFAF6; --surface-2:#F4F0E8; --surface-3:#E8E2D6;
  --ink:#1A1613; --ink-2:#4B4238; --muted:#877C6F;
  --line:#DBD3C5; --line-soft:#EBE5D9;
  --accent:#14455E; --accent-2:#1D6285; --accent-soft:#DDE9F0; --accent-ink:#FFFDF9;
  --ok:#2E6B4C; --ok-bg:#DFEDE4; --warn:#8A5F0C; --warn-bg:#F7EBD3; --crit:#A02F26; --crit-bg:#F8E1DD;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(46,34,18,.05), 0 10px 26px -16px rgba(46,34,18,.22);
  --shadow-1:0 1px 2px rgba(46,34,18,.05);
  --shadow-2:0 2px 5px rgba(46,34,18,.07), 0 14px 30px -16px rgba(46,34,18,.28);
  --accent-glow:0 1px 2px rgba(20,69,94,.28), 0 8px 18px -10px rgba(20,69,94,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141210; --surface:#1E1A15; --surface-2:#26221A; --surface-3:#2F2A21;
  --ink:#EFE9DE; --ink-2:#C2B8A8; --muted:#8E8474;
  --line:#3A342A; --line-soft:#2B261E;
  --accent:#7FB9D8; --accent-2:#9BCCE6; --accent-soft:#1A2E39; --accent-ink:#0F2029;
  --ok:#6FBE93; --ok-bg:#1C3025; --warn:#D9A653; --warn-bg:#332810; --crit:#E4877B; --crit-bg:#38201C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 16px 34px -16px rgba(0,0,0,.9);
  --accent-glow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -10px rgba(127,185,216,.35);
}}
:root[data-theme="dark"]{
  --ground:#141210; --surface:#1E1A15; --surface-2:#26221A; --surface-3:#2F2A21;
  --ink:#EFE9DE; --ink-2:#C2B8A8; --muted:#8E8474;
  --line:#3A342A; --line-soft:#2B261E;
  --accent:#7FB9D8; --accent-2:#9BCCE6; --accent-soft:#1A2E39; --accent-ink:#0F2029;
  --ok:#6FBE93; --ok-bg:#1C3025; --warn:#D9A653; --warn-bg:#332810; --crit:#E4877B; --crit-bg:#38201C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 16px 34px -16px rgba(0,0,0,.9);
  --accent-glow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -10px rgba(127,185,216,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01"}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(46,34,18,.03)}
.top{padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);
  font-variation-settings:"wdth" 88;font-weight:800;font-size:13px;letter-spacing:.07em}
.mark .sq{width:19px;height:19px;border-radius:5px;flex:0 0 19px;position:relative;
  background:linear-gradient(155deg,var(--accent-2),var(--accent));box-shadow:var(--accent-glow)}
.mark .sq::after{content:"";position:absolute;left:4px;top:4px;width:11px;height:11px;
  border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);
  border-bottom-left-radius:2px}
.mark .sq::before{content:"";position:absolute;left:6.5px;top:5px;width:2px;height:8px;
  background:var(--accent-ink);transform:rotate(-38deg);transform-origin:bottom center;border-radius:1px}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:4px 11px;border:1px solid var(--line);
  border-radius:999px;color:var(--muted);white-space:nowrap;background:var(--surface-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.crit{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
.card{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-top:10px;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card:first-of-type{margin-top:6px}
.card select,.card input{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2);color:var(--ink)}
.card select:focus,.card input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.card a{color:var(--accent-2)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- кнопки ---------- */
.btn{font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  box-shadow:var(--shadow-1);
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease,color .13s ease}
.btn:hover:not(:disabled){color:var(--ink);border-color:var(--accent-2);
  box-shadow:var(--shadow-2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0);box-shadow:var(--shadow-1)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));
  border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--accent-glow)}
.btn.primary:hover:not(:disabled){color:var(--accent-ink);border-color:var(--accent);filter:brightness(1.09)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}

/* ---------- вкладки ---------- */
nav.rail{padding:0 14px 9px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.rail button{background:none;border:1px solid transparent;border-radius:var(--radius-sm);
  padding:7px 12px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:500;
  white-space:nowrap;display:flex;gap:7px;align-items:center;
  transition:background .13s ease,color .13s ease,box-shadow .13s ease}
nav.rail button:hover{background:var(--surface-2);color:var(--ink)}
nav.rail button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600;box-shadow:var(--accent-glow)}
.c{font-family:var(--f-mono);font-size:10px;background:var(--surface-3);color:var(--muted);
  padding:1.5px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
nav.rail button[aria-selected="true"] .c{background:rgba(255,255,255,.22);color:var(--accent-ink)}

.wrap{max-width:1340px;margin:0 auto;padding:20px 20px 80px}
.view{display:none}.view.on{display:block}

/* ---------- показатели ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 16px;box-shadow:var(--shadow-1)}
.kpi .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-variation-settings:"wdth" 90;font-weight:700;
  font-size:26px;letter-spacing:-.018em;margin-top:4px;line-height:1.08;font-variant-numeric:tabular-nums}
.kpi .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.klick{cursor:pointer;position:relative;padding-right:34px;
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease}
.kpi.klick::after{content:"→";position:absolute;right:13px;top:12px;font-size:15px;
  color:var(--muted);transition:transform .13s ease,color .13s ease}
.kpi.klick:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--accent-2)}
.kpi.klick:hover::after{color:var(--accent-2);transform:translateX(3px)}
.kpi.klick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi.klick:active{transform:translateY(0)}
.kpi.c{box-shadow:inset 3px 0 0 var(--crit),var(--shadow-1)}.kpi.c .v{color:var(--crit)}
.kpi.w{box-shadow:inset 3px 0 0 var(--warn),var(--shadow-1)}.kpi.w .v{color:var(--warn)}
.kpi.o{box-shadow:inset 3px 0 0 var(--ok),var(--shadow-1)}.kpi.o .v{color:var(--ok)}

/* ---------- панели ---------- */
.cols{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media(max-width:880px){.cols{grid-template-columns:1fr}.vergleich{grid-template-columns:1fr!important}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-1)}
.panel h3{padding:11px 16px;margin:0;font-size:10.5px;font-family:var(--f-mono);letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);display:flex;gap:9px;align-items:center}
.panel h3 .rt{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px}
.pb{padding:16px}

/* ---------- фильтры слева ---------- */
.filters{padding:8px}
.filters button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;
  background:none;border:0;text-align:left;font-size:13px;color:var(--ink-2);padding:7px 11px;
  border-radius:7px;cursor:pointer;line-height:1.3;transition:background .12s ease,color .12s ease}
.filters button:hover{background:var(--surface-2);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600;
  box-shadow:var(--accent-glow)}
.filters button[aria-pressed="true"] .c{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.fg{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding:12px 11px 5px}

/* ---------- строки списка ---------- */
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);
  align-items:flex-start;width:100%;text-align:left;background:none;border-left:0;border-right:0;
  border-top:0;color:inherit;cursor:pointer;transition:background .12s ease}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.stripe{width:3px;align-self:stretch;border-radius:999px;background:var(--line);flex:0 0 3px}
.stripe.sperre{background:var(--crit)}.stripe.pruefen{background:var(--warn)}
.stripe.frei,.stripe.ok{background:var(--ok)}
.grow{flex:1;min-width:0}
.t{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.s{font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:3px;overflow-wrap:anywhere}
.amt{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;font-weight:500;
  white-space:nowrap;text-align:right}
.amt .nb{font-family:var(--f-mono);font-size:10px;color:var(--muted);display:block;margin-top:3px;font-weight:400}
.done{opacity:.42}

/* ---------- карточка документа ---------- */
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.did{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dhead h2{font-size:20px;font-weight:700;font-variation-settings:"wdth" 92;letter-spacing:-.016em;
  margin-top:5px;line-height:1.22;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line-soft)}
.meta>div{background:var(--surface);padding:11px 16px}
.meta .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta .v{font-size:13.5px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bef{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.bef:last-child{border-bottom:0}
.ico{flex:0 0 19px;height:19px;border-radius:5px;margin-top:1px;display:grid;place-items:center;
  font-size:10px;font-weight:700;font-family:var(--f-mono);color:#fff}
.ico.sperre{background:var(--crit)}.ico.pruefen{background:var(--warn)}.ico.hinweis{background:var(--muted)}
.bt{font-size:13px;font-weight:600;line-height:1.35}
.bx{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.55;overflow-wrap:anywhere}
.bq{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:5px}
.acts{padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 20px;
  border-bottom:1px solid var(--line-soft)}
.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);min-width:122px}
input,select{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:7px 11px;font-size:13px;min-width:0;flex:1;
  transition:border-color .12s ease,box-shadow .12s ease}
input:hover,select:hover{border-color:var(--muted)}
input:focus,select:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input::placeholder{color:var(--muted);opacity:.75}
.note{font-size:12px;color:var(--muted);padding:12px 20px;border-top:1px solid var(--line-soft);
  background:var(--surface-2);line-height:1.6}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.75}

/* ---------- таблицы ---------- */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
th{text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;padding:2.5px 9px;border-radius:999px;
  white-space:nowrap;font-weight:500;border:1px solid transparent}
.p-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.p-neut{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);
  color:var(--ground);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:90;
  box-shadow:var(--shadow-2);max-width:88vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fenster[hidden]{display:none!important}
.fenster{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.55);
  display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.fkasten{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  width:100%;max-width:660px;padding:22px 24px 24px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.fkasten h2{margin:0 0 4px}
.fkasten .lead{margin:0 0 16px}
.fzeile{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fkasten input[type=text],.fkasten textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink)}
.fkasten textarea{min-height:120px;resize:vertical;line-height:1.5}
.fkasten input:focus,.fkasten textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fart button{font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink-2);cursor:pointer}
.fart button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600}
.ablage{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;
  color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:10px}
.ablage.drauf{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ablage img{max-width:100%;max-height:230px;border-radius:7px;display:block;margin:0 auto}
.umstand{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:9px;
  padding:10px 12px;margin-bottom:12px;line-height:1.5}
.meine{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.meine .zeile{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.meine .zeile:last-child{border-bottom:none}
.meine b{font-size:14px}
.meine .ant{font-size:13px;color:var(--ink-2);margin-top:5px;padding-left:10px;
  border-left:2px solid var(--accent)}
.mikrofon.hoert{border-color:var(--warn);color:var(--warn);animation:hpuls 1.1s infinite}
@keyframes hpuls{0%,100%{opacity:1}50%{opacity:.5}}
</style>

<script>
/* ============================================================
   Мост между приложением и сервером VAV.
   Приложение написано под окружение Claude (window.claude.use).
   Здесь тот же интерфейс, но данные идут в собственную базу
   на сервере в Нюрнберге. Код самого приложения не менялся.
   ============================================================ */
(function(){
  const J = async (url, opt) => {
    const r = await fetch(url, Object.assign({credentials:'same-origin'}, opt||{}));
    if(r.status===401){ location.href='/login'; throw new Error('нет сессии'); }
    if(!r.ok) throw new Error('сервер ответил '+r.status);
    return r.json();
  };
  let DATEN=null, STATE=null;
  const lauscher={};                       // collection -> [callback]
  const dokLauscher={};                    // 'coll/id'  -> [callback]

  const snapDoc = (coll,id) => {
    const c=(STATE&&STATE[coll])||{}; const d=c[id];
    return {exists:!!d, data:()=>d||{}, id};
  };
  const snapColl = coll => {
    const c=(STATE&&STATE[coll])||{};
    return {docs:Object.keys(c).map(id=>({id, data:()=>c[id]}))};
  };
  const melde = coll => {
    (lauscher[coll]||[]).forEach(cb=>{ try{cb(snapColl(coll));}catch(e){console.warn(e);} });
    Object.keys(dokLauscher).forEach(k=>{
      if(k.split('/')[0]!==coll) return;
      const [c,i]=k.split('/');
      (dokLauscher[k]||[]).forEach(cb=>{ try{cb(snapDoc(c,i));}catch(e){console.warn(e);} });
    });
  };
  const schreib = async (coll,id,wert) => {
    STATE[coll] = STATE[coll]||{};
    if(wert===null) delete STATE[coll][id]; else STATE[coll][id]=wert;
    melde(coll);
    await J('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({collection:coll,id:id,wert:wert})});
  };

  const db = {
    doc(pfad){
      const [coll,id]=pfad.split('/');
      return {
        async get(){
          if(coll==='daten') return {exists:!!DATEN[id], data:()=>DATEN[id]||{}};
          return snapDoc(coll,id);
        },
        set:(w)=>schreib(coll,id,w),
        delete:()=>schreib(coll,id,null),
        onSnapshot(cb){
          const k=coll+'/'+id; (dokLauscher[k]=dokLauscher[k]||[]).push(cb);
          setTimeout(()=>cb(coll==='daten'?{exists:!!DATEN[id],data:()=>DATEN[id]||{}}:snapDoc(coll,id)),0);
          return ()=>{};
        }
      };
    },
    collection(coll){
      return { onSnapshot(cb){
        (lauscher[coll]=lauscher[coll]||[]).push(cb);
        setTimeout(()=>cb(snapColl(coll)),0);
        return ()=>{};
      } };
    }
  };

  const laden = (async()=>{
    const r = await J('/api/daten');
    DATEN=r.daten; STATE=r.state||{};
    window.__vav = { benutzer: r.benutzer||null, live: r.live||null, start: r.start||'' };
    try{
      const b=r.benutzer, w=document.getElementById('wer');
      if(b&&w){ w.textContent = b.name+' · '+b.rollenname; w.className='chip on'; }
      const q=document.getElementById('quelle');
      if(q) { const ok=r.live&&r.live.ok;
        q.textContent = ok ? 'данные живые' : 'данные из снимка';
        q.className = 'chip '+(ok?'on':'warn');
        if(!ok&&r.live&&r.live.grund) q.title = r.live.grund; }
      const st=document.getElementById('start');
      if(st&&r.start){ const d=r.start.split('-');
        st.textContent='учёт с '+d[2]+'.'+d[1]+'.'+d[0]; st.className='chip on'; st.hidden=false;
        st.title='Кредиторка, разнос и нумерация считаются с этой даты. Правовые сроки и долги показаны целиком.'; }
    }catch(e){}
  })();

  window.claude = {
    use: async name => {
      if(name==='db'){ await laden; return db; }
      if(name==='downloads') return { save:({filename,data})=>{
        const b=new Blob([data],{type:'text/csv;charset=utf-8'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(b); a.download=filename||'export.csv';
        document.body.appendChild(a); a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
      }};
      return null;                      // Drive-проверка на сервере пока не подключена
    }
  };
})();
</script>

<script>
const EUR = n => (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const H = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEUTE = new Date('2026-09-05');
const days = d => d ? Math.round((HEUTE - new Date(d))/864e5) : null;
let DB=null, MCP=null, DL=null;
let S = {belege:[], objekte:[], partner:[], regeln:[], zahlungen:[], ust:{}, geld:{}, gd:{}, liq:{}, deb:{}, nr:{}, zo:{}, mg:{}, ub:{}, mw:{}, einn:{}, erw:{}, meta:{}, ent:{}, pdaten:{}, zuord:{}};
let view='cockpit', filt='alle', sel=null, selP=null;

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

const has=(e,r)=>e.befunde&&e.befunde.some(f=>f.regel===r);
const objOf=e=>S.zuord[e.mail_id]?.objekt ?? e.objekt;
const entOf=e=>S.ent[e.mail_id]?.status || '';

/* ---------- загрузка ---------- */
// window.claude появляется не мгновенно: ждём его, но не бесконечно.
function warteAufClaude(msMax=15000){
  return new Promise(res=>{
    if(typeof window.claude?.use === 'function') return res(window.claude);
    const t0=Date.now();
    const iv=setInterval(()=>{
      if(typeof window.claude?.use === 'function'){ clearInterval(iv); res(window.claude); }
      else if(Date.now()-t0>msMax){ clearInterval(iv); res(null); }
    },150);
  });
}
const use = async name => { try{ const c=await warteAufClaude(); return c ? await c.use(name) : null; }
                            catch(e){ console.warn('use',name,e); return null; } };

async function boot(){
  render();                                  // страница никогда не остаётся пустой
  document.getElementById('dbstate').textContent = 'подключаюсь…';
  DB = await use('db');
  document.getElementById('dbstate').textContent = DB ? 'база подключена' : 'база недоступна';
  document.getElementById('dbstate').className = 'chip ' + (DB?'on':'crit');
  if(!DB){ bereit=true; render(); return; }
  const body = s => (s && s.exists) ? (s.data()||{}) : {};
  try{
    const [bs,os,ps,rs,us,gs,zs,ls,ds,ns,zo,mg,ub,mw,po] = await Promise.all([
      DB.doc('daten/belege').get(), DB.doc('daten/objekte').get(),
      DB.doc('daten/partner').get(), DB.doc('daten/regeln').get(),
      DB.doc('daten/ust').get(),    DB.doc('daten/geld').get(),
      DB.doc('daten/zahlungen').get(), DB.doc('daten/liquiditaet').get(), DB.doc('daten/debitoren').get(), DB.doc('daten/nummern').get(), DB.doc('daten/zuordnung').get(), DB.doc('daten/marge').get(), DB.doc('daten/unbezahlt').get(), DB.doc('daten/mahnwesen').get(), DB.doc('daten/post').get()]);
    const b=body(bs), o=body(os), p=body(ps), r=body(rs);
    S.belege=b.items||[]; S.objekte=o.items||[]; S.partner=p.items||[]; S.regeln=r.items||[];
    S.ust=body(us); S.geld=body(gs); S.zahlungen=body(zs).items||[]; S.liq=body(ls); S.deb=body(ds); S.nr=body(ns); S.zo=body(zo); S.mg=body(mg); S.ub=body(ub); S.mw=body(mw); S.po=body(po);
    try{ DB.doc('grunddaten/basis').onSnapshot(d=>{ S.gd=(d&&d.exists)?(d.data()||{}):{}; render(); },
                                                e=>console.warn('grunddaten',e)); }
    catch(e){ const g=await DB.doc('grunddaten/basis').get().catch(()=>null); S.gd=(g&&g.exists)?(g.data()||{}):{}; }
    S.meta={stand:b.stand, quelle:b.quelle, regelversion:r.version};
    document.getElementById('stand').textContent = 'Снимок ' + (b.stand||'—');
    const listen=(coll,key)=>DB.collection(coll).onSnapshot(snap=>{
      S[key]={}; (snap?.docs||[]).forEach(d=>{ S[key][d.id]={id:d.id,...(d.data()||{})}; }); render();
    }, err=>console.warn(coll,err));
    listen('entscheidungen','ent'); listen('partner_daten','pdaten'); listen('zuordnung','zuord');
    listen('einnahmen','einn'); listen('erwartung','erw');
  }catch(err){ console.error(err); toast('Не удалось прочитать базу: '+(err?.code||err?.message||'ошибка')); }
  bereit = true;
  render();
  use('mcp').then(m=>MCP=m);
  use('downloads').then(d=>{ DL=d; document.getElementById('export').disabled=!d; });
}

/* ---------- разделы ---------- */
const TABS = [
  ['cockpit','Пульт'],
  ['steuern','Налоги', ()=>S.ust?.risiko?.length||null],
  ['modell','Модель'],
  ['liqui','Ликвидность'],
  ['debit','Дебиторка', ()=>S.deb?.summe?.unbezahlt_n||null],
  ['mahn','Mahnwesen', ()=>{const m=S.mw?.items||[]; return m.filter(x=>(x.stufe||0)>=2).length||null;}],
  ['unbez','Неоплаченные', ()=>{const q=S.ub?.quellen||[]; return q.reduce((a,x)=>a+x.n,0)||null;}],
  ['post','Почта', ()=>{const d=S.po?.defekte||[]; return d.length||null;}],
  ['razn','Разнос', ()=>RZ.zahlen?(RZ.zahlen.offen_stk||null):null],
  ['recht','Право', ()=>PR.zahlen?((PR.zahlen.ueberfaellig+PR.zahlen.diese_woche)||null):null],
  ['nummern','Нумерация'],
  ['belege','Кредиторка', ()=>S.belege.filter(e=>!entOf(e)).length],
  ['objekte','Объекты', ()=>S.belege.filter(e=>!objOf(e)||objOf(e)==='не распределён').length],
  ['partner','Контрагенты', ()=>S.partner.filter(p=>p.subunternehmer&&!(S.pdaten[p.id]?.fb_48b_bis)).length],
  ['geld','Деньги', ()=>S.belege.filter(e=>e.status==='неоплачено').length],
  ['regeln','Правила'],
];

let bereit=false;
function render(){
  const app = document.getElementById('app');
  try{
    const _erl = (window.__vav&&window.__vav.benutzer&&window.__vav.benutzer.tabs)||null;
    const _sicht = _erl ? TABS.filter(([k])=>_erl.includes(k)) : TABS;
    if(_erl && !_erl.includes(view) && _sicht.length) view = _sicht[0][0];
    document.getElementById('nav').innerHTML = _sicht.map(([k,t,cnt])=>{
      let n=null; try{ n = cnt?cnt():null; }catch(e){}
      return `<button role="tab" data-v="${k}" aria-selected="${view===k}">${t}${n?`<span class="c">${n}</span>`:''}</button>`;
    }).join('');
    if(!bereit){ app.innerHTML = `<div class="panel"><div class="empty">Подключаюсь к базе приложения…</div></div>`; return; }
    const _ohneBelege = ['razn','recht','regeln','objekte'];
    if((!DB || !S.belege.length) && _ohneBelege.indexOf(view)<0){ app.innerHTML = `<div class="panel"><div class="empty">
      ${DB?'Документов пока нет.':'База этому просмотру не выдана — попробуйте открыть страницу заново.'}<br>
      ${DB?'<span style="font-size:12.5px;color:var(--muted)">Учёт начинается '+((window.__vav&&window.__vav.start)||'')+'. Первый документ появится здесь, как только придёт письмо.</span>':''}
      </div></div>`; return; }
    app.innerHTML = ({cockpit:vCockpit, steuern:vSteuern, modell:vModell, liqui:vLiqui, debit:vDebit, mahn:vMahn, unbez:vUnbez, post:vPost, nummern:vNummern, belege:vBelege,
                      objekte:vObjektregister, partner:vPartner, geld:vGeld, regeln:vRegeln, razn:vRazn, recht:vRecht})[view]();
    kpiKlickbar();
    if(view==='razn') rzZurueck();
  }catch(err){
    console.error('render', err);
    app.innerHTML = `<div class="panel"><div class="empty">Раздел не отрисовался.<br>
      <span style="font-family:var(--f-mono);font-size:12px">${H(err&&err.message||err)}</span></div></div>`;
  }
}


/* ---------- денежный блок на пульте ---------- */
function geldBlock(){
  const rows=wochenModell(); if(!rows.length) return '';
  const hat=rows[0].hatSaldo, neg=rows.filter(r=>r.saldo<0);
  const D=S.deb||{}, uf=D.unfakturiert||{};
  const dp=debitorenPlan().filter(d=>d.an);
  const tab=dp.reduce((s,x)=>s+x.rest_tabelle,0), bru=dp.reduce((s,x)=>s+x.rest_gerechnet,0);
  const konto=Number((S.gd||{}).kontostand||0);
  const tage=neg.length? Math.round((new Date(neg[0].von)-new Date('2026-09-05'))/864e5) : null;
  const hebel=[
    ['Выставить отработанные часы', uf.summe||0,
     `${(uf.stunden||0).toLocaleString('de-DE')} часов записано, счёт не выставлен. Деньги ваши по праву.`, 'debit'],
    ['Разобрать расхождение в дебиторке', Math.max(0,bru-tab),
     `По колонке остатка ждём ${EUR(tab)}, по «брутто минус оплачено» ${EUR(bru)}. Один разговор с тем, кто ведёт таблицу.`, 'debit'],
    ['Проставить реальные сроки оплат', 0,
     'Сейчас вся дебиторка свалена в первую неделю, потому что просрочена. Поставьте свои даты — прогноз выпрямится.', 'debit'],
  ];
  if(!hat) return `<div class="panel"><h3>Деньги</h3><div class="empty">
    Введите остаток на счету в разделе «Модель» — и здесь появится дата кассового разрыва.</div></div>`;
  return `<div class="panel" style="border-color:${neg.length?'var(--crit)':'var(--ok)'}">
    <h3>Деньги<span class="rt chip ${neg.length?'crit':'on'}">${neg.length?'требует действий':'в порядке'}</span></h3>
    <div class="pb">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px">
        <div><div class="k" style="font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">На счету</div>
          <div style="font-family:var(--f-display);font-weight:700;font-size:26px;margin-top:2px">${EUR(konto)}</div></div>
        ${neg.length?`<div><div class="k" style="font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">Разрыв</div>
          <div style="font-family:var(--f-display);font-weight:700;font-size:26px;margin-top:2px;color:var(--crit)">через ${tage} дн.</div>
          <div style="font-size:12px;color:var(--muted)">${H(neg[0].von)} · не хватит ${EUR(Math.abs(neg[0].saldo))}</div></div>`:''}
        <div><div class="k" style="font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">Уходит в неделю</div>
          <div style="font-family:var(--f-display);font-weight:700;font-size:26px;margin-top:2px">${EUR((S.liq||{}).pro_woche||0)}</div></div>
        <div><div class="k" style="font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">Ждём от заказчиков</div>
          <div style="font-family:var(--f-display);font-weight:700;font-size:26px;margin-top:2px">${EUR(tab)}</div>
          <div style="font-size:12px;color:var(--muted)">${dp.length} счетов, все просрочены</div></div>
      </div>
      ${neg.length?`<p style="margin:0 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.6">
        После первой недели в прогнозе <b>ни одного поступления за двенадцать недель</b> — не потому что их не будет,
        а потому что в системе нет ни одного счёта с ожидаемой оплатой позже сентября. Это и есть настоящая проблема;
        разрыв — её следствие.</p>`:''}
    </div>
    <h3 style="border-top:1px solid var(--line-soft)">Что двигает дату вправо</h3>
    ${hebel.map(([t,sum,txt,tab_])=>`<div class="row" style="cursor:pointer" data-goto="${tab_}">
      <span class="stripe ${sum>50000?'sperre':'pruefen'}"></span>
      <span class="grow"><span class="t">${t}</span><span class="s" style="font-family:var(--f-body);font-size:12.5px;color:var(--ink-2);letter-spacing:0">${txt}</span></span>
      <span class="amt">${sum?'+'+EUR(sum):''}</span></div>`).join('')}
  </div>`;
}

/* ---------- пульт ---------- */
function vCockpit(){
  const b=S.belege, n=b.length||1;
  const sperre=b.filter(e=>e.entscheidung==='sperre'), pruef=b.filter(e=>e.entscheidung==='pruefen');
  const offen=b.filter(e=>e.status==='неоплачено');
  const diff=b.filter(e=>has(e,'R-BEL-03')), ohne=b.filter(e=>!objOf(e)||objOf(e)==='не распределён');
  const pen=b.reduce((s,e)=>s+(e.mahngebuehr||0),0);
  const erledigt=b.filter(e=>entOf(e)).length;
  const spaet=offen.filter(e=>e.faellig&&days(e.faellig)>0);
  const kpi=(cl,k,v,m)=>`<div class="kpi ${cl}"><div class="k">${k}</div><div class="v">${v}</div><div class="m">${m}</div></div>`;
  return `
  ${geldBlock()}
  <div class="kpis">
    ${kpi('c','Заблокировано',sperre.length,'дубликаты и стопы')}
    ${kpi('w','Требует решения',pruef.length-erledigt<0?0:pruef.length,'из '+b.length+' документов')}
    ${kpi('o','Разобрано вами',erledigt,erledigt?Math.round(erledigt/n*100)+' %':'пока ничего')}
    ${kpi('c','Расхождение суммы',diff.length,EUR(diff.reduce((s,e)=>s+e.betrag,0)))}
    ${kpi('w','Без объекта',ohne.length,'не попадёт в себестоимость')}
    ${kpi('c','Просрочено',spaet.length,EUR(spaet.reduce((s,e)=>s+e.betrag,0)))}
    ${kpi('c','Пени накоплено',EUR(pen),'Mahnkosten')}
    ${kpi('','Неоплачено',offen.length,EUR(offen.reduce((s,e)=>s+e.betrag,0)))}
  </div>
  <div class="cols">
    <div style="grid-column:1/-1">
      <div class="panel"><h3>Требует решения сегодня<span class="rt chip">по строгости</span></h3>
        ${b.filter(e=>!entOf(e)).sort((x,y)=>
            ({sperre:0,pruefen:1,hinweis:2,frei:3}[x.entscheidung]-{sperre:0,pruefen:1,hinweis:2,frei:3}[y.entscheidung])
            || (y.betrag-x.betrag)).slice(0,8).map(e=>rowBeleg(e)).join('') || '<div class="empty">Всё разобрано.</div>'}
      </div>
      <div class="panel"><h3>Что нашли правила</h3><div class="tbl"><table>
        <thead><tr><th>Правило</th><th>Находка</th><th class="n">Документов</th><th class="n">Сумма</th></tr></thead><tbody>
        ${regelStat().map(r=>`<tr><td><b>${r.id}</b></td><td>${H(r.titel)}</td>
          <td class="n">${r.n}</td><td class="n">${EUR(r.sum)}</td></tr>`).join('')}
        </tbody></table></div></div>
    </div>
  </div>`;
}
function regelStat(){
  const m={}; S.belege.forEach(e=>(e.befunde||[]).forEach(f=>{
    (m[f.regel] ||= {id:f.regel,titel:f.titel,n:0,sum:0}); m[f.regel].n++; m[f.regel].sum+=e.betrag||0; }));
  return Object.values(m).sort((a,b)=>b.n-a.n);
}

/* ---------- кредиторка ---------- */
const FILTERS=[
  ['g','Строгость'],['alle','Все',()=>true],
  ['sperre','Заблокировано',e=>e.entscheidung==='sperre'],
  ['pruefen','На проверку',e=>e.entscheidung==='pruefen'],
  ['offen','Не разобрано',e=>!entOf(e)],
  ['g','Находки'],
  ['dub','Дубликаты',e=>has(e,'R-BEL-02')],
  ['diff','Расхождение суммы',e=>has(e,'R-BEL-03')],
  ['obj','Без объекта',e=>!objOf(e)||objOf(e)==='не распределён'],
  ['firma','Фирма не ясна',e=>has(e,'R-BEL-08')],
  ['pen','С пенями',e=>has(e,'R-ZAH-05')],
  ['spaet','Просрочено',e=>has(e,'R-ZAH-06')],
];
const fnOf=k=>(FILTERS.find(f=>f[0]===k)||[])[2]||(()=>true);
function rowBeleg(e){
  const nb=(e.befunde||[]).length, st=entOf(e);
  return `<button class="row ${st?'done':''}" data-beleg="${e.mail_id}" aria-current="${sel===e.mail_id}">
    <span class="stripe ${e.entscheidung}"></span>

/* ---------- объекты ---------- */

function margeBlock(){
  const M=S.mg||{}, g=M.gesamt||{}, it=(M.items||[]).slice().sort((a,b)=>a.marge-b.marge);
  if(!it.length) return '';
  const mx=Math.max(...it.map(x=>Math.abs(x.marge)),1);
  const bal=v=>{const w=Math.abs(v)/mx*50; return `<div style="position:relative;height:10px">
    <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)"></div>
    <div style="position:absolute;top:1px;height:8px;border-radius:2px;background:${v<0?'var(--crit)':'var(--ok)'};
      ${v<0?`right:50%;width:${w}%`:`left:50%;width:${w}%`}"></div></div>`;};
  const kpi=(cl,k,v,m)=>`<div class="kpi ${cl}"><div class="k">${k}</div><div class="v">${v}</div><div class="m">${m}</div></div>`;
  return `<div class="kpis">
    ${kpi('','Выставлено по объектам',EUR(g.brutto),'брутто')}
    ${kpi('c','Затраты по объектам',EUR(g.kosten),'из реестра расходов')}
    ${kpi(g.marge<0?'c':'o','Маржа',EUR(g.marge),g.marge<0?'расходы больше выручки':'положительная')}
    ${kpi('c','Объектов в минусе',M.minus_n,EUR(M.minus_summe))}
  </div>
  <div class="panel" style="border-color:var(--crit)"><h3>Маржа по объектам<span class="rt chip crit">по счетам, не по часам</span></h3>
    <div class="tbl"><table><thead><tr><th>Объект</th><th class="n">Выставлено</th><th class="n">Получено</th>
      <th class="n">Затраты</th><th style="width:130px">Маржа</th><th class="n">Итог</th></tr></thead><tbody>
    ${it.map(x=>`<tr${x.marge<-20000?' style="background:var(--crit-bg)"':''}>
      <td><b>${H(x.projekt)}</b>${x.kunde?`<div style="color:var(--muted);font-size:11.5px">${H(x.kunde)}</div>`:''}
        ${x.ohne_rechnung?'<span class="pill p-crit">счёт не выставлен</span>':''}</td>
      <td class="n">${x.brutto?EUR(x.brutto):'—'}</td>
      <td class="n" style="color:var(--muted)">${x.bezahlt?EUR(x.bezahlt):'—'}</td>
      <td class="n">${x.kosten?EUR(x.kosten):'—'}</td>
      <td>${bal(x.marge)}</td>
      <td class="n" style="font-weight:600;color:${x.marge<0?'var(--crit)':'var(--ok)'}">${EUR(x.marge)}${
        x.marge_pct!==null&&x.marge_pct!==undefined?`<span class="nb">${x.marge_pct} %</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">Маржа = выставлено брутто минус затраты по объекту. Это не прибыль по бухгалтерии, а простое сопоставление
      счетов: сколько запросили у заказчика против того, сколько потратили. Накладные расходы фирмы сюда не разнесены,
      поэтому настоящий результат ещё ниже.</p>
    <p class="note" style="border-top:0;padding-top:0"><b>Свежесть:</b> счета в этой таблице обрываются на ${H(M.stand_rechnungen)},
      затраты — на ${H(M.stand_kosten)}. Источник: ${H(M.quelle)}.</p></div>

  <div class="panel"><h3>Объекты, где работали и не выставили ни одного счёта<span class="rt chip">${M.ohne_rechnung_n}</span></h3>
    ${it.filter(x=>x.ohne_rechnung).sort((a,b)=>b.kosten-a.kosten).map(x=>`<div class="row" style="cursor:default">
      <span class="stripe sperre"></span><span class="grow"><span class="t">${H(x.projekt)}</span>
      <span class="s">затрачено, счёт заказчику не выставлен</span></span>
      <span class="amt" style="color:var(--crit)">${EUR(x.kosten)}</span></div>`).join('')}
    <p class="note">Итого ${EUR(M.ohne_rechnung_summe)} потрачено на объектах, по которым не выставлено ни одного счёта.
      Часть из них может быть в работе, но каждый такой объект нужно проверить поимённо: либо счёт забыли, либо это чистый убыток.</p></div>`;
}

function vObjekte(){
  const byObj={}; S.belege.forEach(e=>{ const k=objOf(e)||'не распределён'; (byObj[k] ||= []).push(e); });
  const ohne=byObj['не распределён']||[];
  const rows=Object.entries(byObj).filter(([k])=>k!=='не распределён')
    .map(([k,v])=>({k,n:v.length,sum:v.reduce((s,e)=>s+e.betrag,0)})).sort((a,b)=>b.sum-a.sum);
  const max=Math.max(1,...rows.map(r=>r.sum));
  return `${margeBlock()}
  <div class="kpis">
    <div class="kpi"><div class="k">Объектов в справочнике</div><div class="v">${S.objekte.length}</div><div class="m">своей нумерации нет</div></div>
    <div class="kpi w"><div class="k">Документов без объекта</div><div class="v">${ohne.length}</div><div class="m">${EUR(ohne.reduce((s,e)=>s+e.betrag,0))}</div></div>
    <div class="kpi c"><div class="k">Объект записан дважды</div><div class="v">${S.objekte.filter(o=>o.dubl).length}</div><div class="m">из-за разного написания адреса</div></div>
    <div class="kpi o"><div class="k">Привязано вами</div><div class="v">${Object.keys(S.zuord).length}</div><div class="m">в этой сессии и раньше</div></div>
  </div>
  <div class="panel"><h3>Затраты по объектам</h3><div class="pb">
    ${rows.length?rows.map(r=>`<div style="display:grid;grid-template-columns:1fr 90px 130px;gap:10px;align-items:center;padding:6px 0;font-size:13px">
      <span>${H(r.k)}</span><div class="bar"><i style="width:${r.sum/max*100}%"></i></div>
      <span class="amt">${EUR(r.sum)} <span class="nb">${r.n} док.</span></span></div>`).join('')
      :'<div class="empty">Пока ни один документ не привязан к объекту.</div>'}
    </div></div>
  <div class="panel"><h3>Объекты<span class="rt chip">из Google Sheets</span></h3><div class="tbl"><table>
    <thead><tr><th>Машина</th><th>Заказчик</th><th>Адрес</th><th>Состояние</th></tr></thead><tbody>
    ${S.objekte.map(o=>`<tr><td style="font-family:var(--f-mono);font-size:12.5px">${H(o.kennzeichen||'—')}</td>
      <td>${H(o.kunde)}</td><td>${H(o.adresse)}</td>
      <td>${(o.probleme&&o.probleme.length)?o.probleme.map(p=>`<span class="pill ${p.indexOf('дважды')>=0?'p-crit':'p-warn'}" style="margin:1px 2px 1px 0">${H(p)}</span>`).join(''):'<span class="pill p-ok">в порядке</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note"><b>N-VK-####</b> — это автомобильные номера (N = Nürnberg), а не номера объектов.
      Одна машина может стоять на нескольких объектах, и это нормально.
      Собственной нумерации у объектов нет: они опознаются только парой «заказчик плюс адрес».
      В финансовых таблицах Drive объекты нумеруются иначе — №1-11, №7-06, №7-11 — и с этим справочником не связаны.</p></div>

  <div class="panel"><h3>Что мешает привязке сейчас<span class="rt chip">${(S.zo?.summe?.ohne_objekt)||0} документов</span></h3>
    <div class="tbl"><table><thead><tr><th class="n">Док.</th><th>Что стоит в документе</th><th>Что с этим не так</th><th>Что делать</th></tr></thead><tbody>
    ${(S.zo?.items||[]).map(r=>`<tr><td class="n"><b>${r.anzahl}</b></td>
      <td>${H(r.label)}</td>
      <td><span class="pill ${r.art==='привязка неверна'?'p-crit':r.art==='объекта нет в справочнике'?'p-warn':'p-neut'}">${H(r.art)}</span></td>
      <td style="color:var(--ink-2)">${H(r.vorschlag)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">Самое важное здесь — строка про Gihl. Семи документам проставлен объект «Gihl GmbH — 90475 Nürnberg»,
      но объект Gihl находится в <b>54293 Trier-Ehrang</b>. Индекс 90475 — это Нюрнберг, то есть привязка подобрана по почтовому индексу наугад.
      Это хуже, чем отсутствие привязки: расходы попали бы на чужой объект и исказили его себестоимость.</p>
    <p class="note" style="border-top:0;padding-top:0">С этого прогона запрет закреплён в каталоге как правило
      <b>R-OBJ-04 «Objektzuordnung nur aus Postleitzahl»</b>: привязка, у которой единственное основание — индекс, отклоняется,
      документ уходит в очередь на разбор. Плюс <b>R-OBJ-05</b> на несовпадение города и <b>R-OBJ-06</b> на объект, которого нет в справочнике.
      Их видно в разделе «Правила».</p></div>

  <div class="panel"><h3>Почему документы не привязываются<span class="rt chip">корень проблемы</span></h3><div class="pb">
    <p style="margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.6">

    ${(S.objekte||[]).filter(o=>o.dubl).map(o=>`<div class="row" style="cursor:default"><span class="stripe sperre"></span>
      <span class="grow"><span class="t">${H(o.kunde)}</span><span class="s">${H(o.adresse)} · машина ${H(o.kennzeichen||'—')}</span></span></div>`).join('')}
    <p class="note" style="padding:12px 0 0">«Eichenstr 86» и «Eichenstrasse 86» — один и тот же адрес, но для системы это два разных объекта.
      То же с Wirtschaftsweg 27. Отсюда и берётся то, что 26 документов из 32 не удаётся привязать:
      привязывать не к чему. Это чинится один раз — введением номера объекта, а не правилами разбора адресов.</p>
  </div></div>
  <div class="panel"><h3>Документы без объекта<span class="rt chip">${ohne.length}</span></h3>
    ${ohne.slice(0,40).map(rowBeleg).join('')||'<div class="empty">Все документы привязаны.</div>'}</div>`;
}

  const f=(id,lab,val,ph='')=>`<div class="field"><label>${lab}</label><input id="${id}" value="${H(val||'')}" placeholder="${ph}"></div>`;

    ${f('p_ust','USt-IdNr',d.ust_idnr,'DE123456789')}
    ${p.subunternehmer?f('p_48b','§ 48b до',d.fb_48b_bis,'ГГГГ-ММ-ДД'):''}
    ${p.subunternehmer?f('p_48bn','Sicherheitsnummer',d.fb_48b_nummer,''):''}
    ${p.subunternehmer?f('p_tg','USt 1 TG до',d.ust1tg_bis,'ГГГГ-ММ-ДД'):''}
    ${p.subunternehmer?f('p_ml','Mindestlohn до',d.mindestlohn_bis,'ГГГГ-ММ-ДД'):''}

/* ---------- деньги ---------- */
function vGeld(){

/* ---------- дебиторка -> ликвидность ---------- */
const ERWARTBAR = ['ожидаем','недоплата'];      // статусы, которые попадают в прогноз сами
function zahlungsziel(){ return Number((S.gd||{}).zahlungsziel||45); }
function basisTabelle(){ return ((S.gd||{}).basis||'tabelle')==='tabelle'; }
function plusTage(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function debitorenPlan(){
  const L=S.liq||{}, start=L.start||'2026-09-07';
  const ersteWoche=(L.wochen||[])[0];
  return (S.deb?.items||[]).map(x=>{
    const o=S.erw[x.nummer]||{};
    const betrag = basisTabelle()? x.rest_tabelle : x.rest_gerechnet;
    const autoOk = ERWARTBAR.some(w=>(x.status||'').indexOf(w)>=0);
    const an = o.aus===true ? false : (o.aus===false ? true : autoOk);
    let datum = o.datum || plusTage(x.datum, zahlungsziel());
    if(datum < start) datum = ersteWoche? ersteWoche.von : start;   // просроченное — в первую неделю
    return {...x, betrag, datum, an, manuell:!!o.datum, autoOk};
  }).filter(x=>x.betrag>0);
}

/* ---------- ликвидность ---------- */
function wochenModell(){
  const L=S.liq||{}, w=L.wochen||[];
  const einn={}, ausDeb={};
  Object.values(S.einn||{}).forEach(e=>{
    const t=e.datum; if(!t) return;
    const i=w.findIndex(x=>t>=x.von && t<=x.bis); if(i>=0) einn[i]=(einn[i]||0)+Number(e.betrag||0);
  });
  debitorenPlan().filter(d=>d.an).forEach(d=>{
    const i=w.findIndex(x=>d.datum>=x.von && d.datum<=x.bis);
    if(i>=0){ einn[i]=(einn[i]||0)+d.betrag; ausDeb[i]=(ausDeb[i]||0)+d.betrag; }
  });
  let saldo=Number((S.gd||{}).kontostand||0);
  const hatSaldo=!!Number((S.gd||{}).kontostand);
  return w.map((x,i)=>{
    const raus=(x.rechnungen||0)+(x.regulaer||0), rein=einn[i]||0;
    saldo = saldo + rein - raus;
    return {...x, rein, ausDeb:ausDeb[i]||0, raus, saldo:Math.round(saldo), hatSaldo};
  });
}

  const span=(max-min)||1;
  const x=i=>PL+(W-PL-PR)*(i/Math.max(1,rows.length-1));
  const y=v=>PT+(Hh-PT-PB)*(1-(v-min)/span);
  const pts=rows.map((r,i)=>`${x(i).toFixed(1)},${y(r.saldo).toFixed(1)}`).join(' ');
  const flaeche=`${PL},${y(0)} ${pts} ${x(rows.length-1)},${y(0)}`;
  const ticks=[max,min+span/2,min].map(v=>({v,y:y(v)}));
  const neg=rows.filter(r=>r.saldo<0);
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" role="img"
    aria-label="Остаток на счету по неделям">
    ${ticks.map(t=>`<line x1="${PL}" x2="${W-PR}" y1="${t.y.toFixed(1)}" y2="${t.y.toFixed(1)}"
        stroke="var(--line-soft)" stroke-width="1"/>
      <text x="${PL-8}" y="${(t.y+4).toFixed(1)}" text-anchor="end" font-size="10"
        font-family="var(--f-mono)" fill="var(--muted)">${Math.round(t.v/1000)}k</text>`).join('')}
    <line x1="${PL}" x2="${W-PR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"
      stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="${flaeche}" fill="var(--accent)" opacity="0.12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.saldo).toFixed(1)}" r="${r.saldo<0?5:3.5}"
      fill="${r.saldo<0?'var(--crit)':'var(--accent)'}" stroke="var(--surface)" stroke-width="2"><title>Неделя ${r.nr} · ${r.von}
Поступления ${EUR(r.rein)}
Оттоки ${EUR(r.raus)}
Остаток ${EUR(r.saldo)}</title></circle>`).join('')}
    ${rows.map((r,i)=> i%2===0 ? `<text x="${x(i).toFixed(1)}" y="${Hh-10}" text-anchor="middle"

      <tbody>${mahnTop}</tbody></table></div>

var RZ = { entwurf:{}, teilAuf:{}, neuform:false, tage:400, modus:'neu', monat:'', monate:[], filt:'ausgabe', geladen:false, laeuft:false, fehler:'',
           offen:[], erledigt:[], objekte:[], kategorien:[], zahlen:null, suche:'' };

const rzE = n => Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:0})+' €';
const rzKat = kz => (RZ.kategorien.find(k=>k.kz===kz)||{}).bez || kz;

async function ladeRazn(){
  if(RZ.laeuft) return;
  RZ.laeuft = true; RZ.fehler=''; render();
  try{
    const r = await fetch('/api/razn?tage='+RZ.tage+'&modus='+RZ.modus+'&monat='+encodeURIComponent(RZ.monat||''), {credentials:'same-origin'});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    RZ.offen=d.offen||[]; RZ.erledigt=d.erledigt||[];
    RZ.objekte=d.objekte||[]; RZ.kategorien=d.kategorien||[]; RZ.zahlen=d.zahlen||null; RZ.monate=d.monate||[];
    RZ.geladen=true;
  }catch(e){ RZ.fehler = e.message||String(e); }
  RZ.laeuft=false; render();
}

async function rzObjektAnlegen(){
  const g = id => { const e=document.getElementById(id); return e? e.value.trim():''; };
  const bez = g('ro_bez');
  if(bez.length<3){ toast('Нужно название объекта'); return; }
  try{
    const r = await fetch('/api/razn/objekt-neu', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({bez:bez, kunde:g('ro_kunde'), adresse:g('ro_adr'), firma:g('ro_firma'), nr:g('ro_nr')})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    RZ.objekte.unshift({nr:d.nr, bez:d.bez, kunde:g('ro_kunde'), adresse:g('ro_adr'),
      firma:g('ro_firma'), status:'aktiv'});
    RZ.neuform=false;
    toast('Объект создан: '+d.nr);
    render();
  }catch(e){ toast('Не создался: '+(e.message||e)); }
}

/* ---------- черновик карточки ---------- */
/* Человек выбирает категорию, потом ищет следующий платёж — и перерисовка
   стирала выбор. Теперь выбранное держится здесь до подтверждения. */
const RZ_FELDER = ['rzk_','rzo_','rzg_','tk_','to_','tb_','tg_'];
function rzMerken(el){
  if(!el || !el.id) return;
  const p = RZ_FELDER.find(x=>el.id.startsWith(x));
  if(!p) return;
  const id = el.id.slice(p.length);
  RZ.entwurf[id] = RZ.entwurf[id] || {};
  RZ.entwurf[id][p] = el.value;
}
function rzZurueck(){
  for(const id in RZ.entwurf){
    const e = RZ.entwurf[id];
    for(const p in e){
      const el = document.getElementById(p+id);
      if(el && e[p] != null && el.value !== e[p]) el.value = e[p];
    }
  }
}
function rzVergessen(id){ delete RZ.entwurf[id]; }

async function rzTeil(id, loeschen, teilId){
  const z = RZ.offen.find(x=>x.id===id) || RZ.erledigt.find(x=>x.id===id) || {};
  try{
    let koerper;
    if(loeschen){ koerper = {loeschen:true, teil_id:teilId}; }
    else {
      const sk=document.getElementById('tk_'+id), so=document.getElementById('to_'+id);
      const sb=document.getElementById('tb_'+id), sg=document.getElementById('tg_'+id);
      const betrag=(sb?sb.value:'').trim();
      if(!betrag){ toast('Впишите сумму'); if(sb) sb.focus(); return; }
      koerper = {id:id, objekt:so?so.value:'', kategorie:sk?sk.value:'',
                 betrag:betrag, grund:sg?sg.value.trim():'', schluessel:z.schluessel||''};
    }
    const r = await fetch('/api/razn/teil', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(koerper)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    if(!loeschen) rzVergessen(id);
    toast(loeschen?'Часть убрана':'Часть записана');
    RZ.geladen=false; await ladeRazn();
  }catch(e){ toast(e.message||String(e)); }
}
function rzRest(x){
  const v=(x.teile||[]).reduce((s2,t)=>s2+Number(t.betrag||0),0);
  return Math.round((Math.abs(x.betrag)-v)*100)/100;
}

function stufeVon(kz){ return (RZ.kategorien.find(k=>k.kz===kz)||{}).stufe || ''; }
function rzBelege(x){
  const b = x.belege || []; if(!b.length) return '';
  const marke = { genau:['оригинал',' on'], nah:['похоже по сумме',' warn'], name:['документ контрагента',''] };
  return '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
    + '<span class="muted" style="font-size:12px">оригинал:</span>'
    + b.map(function(o){ const m = marke[o.treffer] || ['',''];
        const t = (o.doc_nr? '№'+o.doc_nr+' ' : '') + EUR(o.betrag) + (o.datum? ' · '+o.datum : '');
        return '<a class="chip'+m[1]+'" style="text-decoration:none" target="_blank" rel="noopener" '
          + 'href="/api/razn/original?mail='+encodeURIComponent(o.mail_id)+'&drive='+encodeURIComponent(o.drive_id)+'" '
          + 'title="'+H((o.kontrahent||'')+' — '+m[0])+'">📄 '+H(t)+'</a>';
      }).join('')
    + '</div>';
}
async function rzSetzen(id, festK, festO){
  const z = RZ.offen.find(x=>x.id===id) || {};
  const sk = document.getElementById('rzk_'+id), so = document.getElementById('rzo_'+id);
  const gr = document.getElementById('rzg_'+id);
  const kategorie = festK || (sk? sk.value : '');
  const objekt    = festO || (so? so.value : '');
  const st = stufeVon(kategorie);
  if(!kategorie){ toast('Сначала выберите категорию'); return; }
  if(st==='EKT' && !objekt){ toast('Прямые затраты нужно отнести на объект'); return; }
  try{
    const r = await fetch('/api/razn/setzen', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:id, objekt:objekt, kategorie:kategorie,
        grund: gr? gr.value.trim():'', schluessel: z.schluessel||''})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    rzVergessen(id);
    if(d.fertig){
      const i = RZ.offen.findIndex(x=>x.id===id);
      if(i>=0){ const x=RZ.offen.splice(i,1)[0];
        x.objekt=d.objekt; x.kategorie=d.kategorie; x.grund=gr?gr.value.trim():''; RZ.erledigt.unshift(x);
        if(RZ.zahlen){ const f=RZ.modus==='audit'?'alt':'neu';
          RZ.zahlen[f+'_stk']--; RZ.zahlen.fertig_stk++;
          if(x.typ==='expense'){ RZ.zahlen[f+'_eur']=Math.round((RZ.zahlen[f+'_eur']-x.betrag)*100)/100;
            RZ.zahlen.fertig_eur=Math.round((RZ.zahlen.fertig_eur+x.betrag)*100)/100; } } }
      toast('Записано: '+rzKat(d.kategorie)+' · '+d.objekt);
    } else {
      const x = RZ.offen.find(y=>y.id===id);
      if(x){ x.objekt=d.objekt; x.kategorie=d.kategorie; }
      toast(d.kategorie&&!d.objekt ? 'Категория есть, нужен объект' : 'Объект есть, нужна категория');
    }
    render();
  }catch(e){ toast('Не записалось: '+(e.message||e)); }
}

function hUmstand(){
  const t = TABS.find(x=>x[0]===view);
  const o = { raedchen: view, abschnitt: t?t[1]:view, zeit: new Date().toISOString(),
    fenster: innerWidth+'x'+innerHeight, browser: navigator.userAgent.slice(0,120) };
  if(view==='razn'){ o.monat = RZ.monat||'с даты старта'; o.filter = RZ.filt;
    o.suche = RZ.suche||''; o.offen_stk = RZ.zahlen?RZ.zahlen.neu_stk:null; }
  if(view==='recht'){ o.sicht = PR.sicht; o.filter = PR.filt; o.tage = PR.tage; }
  if(view==='objekte'){ o.suche = RZ.osuche||''; }
  return o;
}
function hUmstandText(){
  const u = hUmstand();
  const t = ['раздел «'+(u.abschnitt||'')+'»'];
  if(u.monat) t.push('месяц: '+u.monat);
  if(u.filter) t.push('фильтр: '+u.filter);
  if(u.suche) t.push('поиск: '+u.suche);
  return t.join(' · ');
}

/* картинка: вставка, выбор файла, перетаскивание — и всегда ужимаем */
function hBildAus(datei){
  if(!datei || !/^image\//.test(datei.type)) return;
  const leser = new FileReader();
  leser.onload = e => {
    const bild = new Image();
    bild.onload = () => {
      const max = 1600, k = Math.min(1, max/Math.max(bild.width, bild.height));
      const c2 = document.createElement('canvas');
      c2.width = Math.round(bild.width*k); c2.height = Math.round(bild.height*k);
      c2.getContext('2d').drawImage(bild, 0, 0, c2.width, c2.height);
      HW.bild = c2.toDataURL('image/jpeg', 0.72);
      hZeichnen();
    };
    bild.src = e.target.result;
  };
  leser.readAsDataURL(datei);
}

async function hSenden(){
  const t = (document.getElementById('h_titel')||{}).value||'';
  if(t.trim().length<3){ toast('Нужно короткое название'); return; }
  HW.laeuft = true; hZeichnen();
  try{
    const r = await fetch('/api/hinweis',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({art:HW.art, titel:t.trim(),
        text:(document.getElementById('h_text')||{}).value||'',
        kontext:hUmstand(), bild:HW.bild})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    HW.bild=null; HW.laeuft=false;
    await hLaden(); hZeichnen();
    toast('Отправлено, № '+d.id);
  }catch(e){ HW.laeuft=false; hZeichnen(); toast('Не отправилось: '+(e.message||e)); }
}

function kpiKlickbar(){
  var erl = (window.__vav && window.__vav.benutzer && window.__vav.benutzer.tabs) || null;
  document.querySelectorAll('#app .kpi').forEach(function(el){
    if(el.dataset.goto) return;
    var k = el.querySelector('.k');
    var t = k ? (k.textContent||'') : '';
    for(var i=0;i<KPI_ZIEL.length;i++){

var PR = { tage:180, sicht:'fristen', filt:'offen', geladen:false, laeuft:false, fehler:'',
           fristen:[], anwalt:[], zahlen:null, auf:'' };

async function ladePR(){
  if(PR.laeuft) return;
  PR.laeuft=true; PR.fehler=''; render();
  try{
    const r = await fetch('/api/recht?tage='+PR.tage, {credentials:'same-origin'});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    PR.fristen=d.fristen||[]; PR.anwalt=d.anwalt||[]; PR.zahlen=d.zahlen||null; PR.geladen=true;
  }catch(e){ PR.fehler=e.message||String(e); }
  PR.laeuft=false; render();
}

async function prStatus(schluessel, status){
  try{
    const el = document.getElementById('prn_'+schluessel.replace(/[^a-z0-9]/gi,'_'));
    const r = await fetch('/api/recht/status', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({schluessel:schluessel, status:status, notiz: el? el.value.trim():''})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler||('HTTP '+r.status));
    const treffer = PR.fristen.filter(x=>x.schluessel===schluessel).concat(PR.anwalt.filter(x=>x.schluessel===schluessel));
    treffer.forEach(x=>{ x.status=status; if(el) x.notiz=el.value.trim(); });
    if(PR.zahlen){ PR.zahlen.ueberfaellig = PR.fristen.filter(x=>x.status==='offen'&&x.tage<0).length;
      PR.zahlen.diese_woche = PR.fristen.filter(x=>x.status==='offen'&&x.tage>=0&&x.tage<=7).length;
      PR.zahlen.erledigt = PR.fristen.filter(x=>x.status==='erledigt').length; }
    toast(status==='erledigt'?'Закрыто':status==='verworfen'?'Убрано из календаря':status==='anwalt'?'Помечено адвокату':'Открыто снова');
    render();
  }catch(e){ toast('Не записалось: '+(e.message||e)); }
}

/**
 * Досье объекта. Номер рождается в плане Олега и живёт с объектом до конца;
 * Постцентраль вешает на него письма и документы, план — часы, банк — оплаты.

 */
let AKTE = { nr:null, laeuft:false, daten:null, fehler:null };

async function ladeAkte(nr){
  AKTE = { nr, laeuft:true, daten:null, fehler:null }; render();
  try {
    const r = await fetch('/api/objekt-akte?nr=' + encodeURIComponent(nr), {credentials:'same-origin'});
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler || 'не открылось');
    AKTE = { nr, laeuft:false, daten:d, fehler:null };
  } catch(e){ AKTE = { nr, laeuft:false, daten:null, fehler:e.message }; }
  render();
}

function akteSchliessen(){ AKTE = { nr:null, laeuft:false, daten:null, fehler:null }; render(); }

let DIKTAT = null;
function diktieren(ziel, sprache, knopf){
  const Erk = window.SpeechRecognition || window.webkitSpeechRecognition;
  const feld = document.getElementById(ziel);
  if(!Erk){ toast('Этот браузер не распознаёт речь — напишите текстом'); if(feld) feld.focus(); return; }
  if(DIKTAT){ try{ DIKTAT.stop(); }catch(e){} return; }
  const r = new Erk();
  r.lang = sprache; r.interimResults = true; r.continuous = true;
  const anfang = feld && feld.value.trim() ? feld.value.trim()+' ' : '';
  r.onstart = () => { if(knopf) knopf.classList.add('hoert'); toast('Говорите…'); };
  r.onresult = e => { let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    if(feld) feld.value = anfang + t.trim(); };
  r.onerror = e => toast(e.error==='not-allowed' ? 'Микрофон не разрешён' : 'Не расслышал: '+e.error);
  r.onend = () => { if(knopf) knopf.classList.remove('hoert'); DIKTAT=null; if(feld) feld.focus(); };
  DIKTAT = r;
  try{ r.start(); }catch(e){ DIKTAT=null; toast('Микрофон занят'); }
}

      await DB.doc('entscheidungen/'+sel).delete(); toast('Отметка снята');
    } else if(sel){
      const lab={ok:'разобрано',rueck:'запрос поставщику',sperr:'платёж заблокирован'}[act];
      if(!lab) return;
      await DB.doc('entscheidungen/'+sel).set({status:lab,
        kommentar:document.getElementById('kom')?.value||'',wann:new Date().toISOString()});
      toast(lab[0].toUpperCase()+lab.slice(1));
    }
  }catch(err){ toast('Не удалось сохранить: '+(err?.code||err?.message||'ошибка')); }
});

/* ---------- Drive и выгрузка ---------- */
document.getElementById('refresh').addEventListener('click',async()=>{
  const btn=document.getElementById('refresh'); btn.disabled=true; btn.textContent='Проверяю…';
  try{
    if(!MCP) MCP = await claude.use('mcp');
    if(!MCP){ toast('Подключение к Drive этому просмотру не выдано'); return; }
    const r=await MCP.callTool('Google Drive','search_files',
      {query:"title contains 'Кредиторка'", pageSize:5, excludeContentSnippets:true});
    const files=(r?.payload?.files)||[];
    const f=files.find(x=>x.id==='1M98apdA9FEW-QQnmP5nkvZSdBfoWdKoRFOs_-cb6ia0')||files[0];
    if(!f){ toast('Таблица не найдена'); return; }
    const mt=(f.modifiedTime||'').slice(0,10);
    toast(mt>(S.meta.stand||'') ? `Таблица менялась ${mt} — снимок устарел, нужен новый прогон`
                                : `Таблица не менялась с ${mt} — снимок актуален`);
  }catch(err){ toast('Drive недоступен: '+(err?.code||err?.message||'ошибка')); }
  finally{ btn.disabled=false; btn.textContent='Проверить Drive'; }
});
document.getElementById('export').addEventListener('click',async()=>{
  if(!DL) DL = await claude.use('downloads');
  if(!DL){ toast('Выгрузка этому просмотру не выдана'); return; }
  const head=['ID','Контрагент','Номер','Дата','Срок','Сумма','Фирма','Объект','Решение','Статус','Комментарий','Находки'];
  const esc=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=S.belege.map(e=>[e.mail_id,e.partner,e.nummer,e.datum,e.faellig,
    String(e.betrag).replace('.',','),e.firma,objOf(e),e.entscheidung,
    S.ent[e.mail_id]?.status||'',S.ent[e.mail_id]?.kommentar||'',
    (e.befunde||[]).map(f=>f.regel).join(' ')].map(esc).join(';'));
  try{ await DL.save({filename:`buchhalter-vav_${S.meta.stand||'export'}.csv`,
        data:'﻿'+[head.map(esc).join(';'),...rows].join('\r\n')});
       toast('Файл предложен к сохранению'); }
  catch(err){ toast('Выгрузка отменена'); }
});

/* ---------- действия окна «Написать нам» ---------- */
document.getElementById('melden').addEventListener('click', hOeffnen);
document.getElementById('hfenster').addEventListener('click', ev => {
  if(ev.target.id === 'hfenster') hSchliessen();
});
addEventListener('keydown', ev => { if(ev.key === 'Escape' && HW.offen) hSchliessen(); });

document.getElementById('hkasten').addEventListener('click', async ev => {
  const a = ev.target.closest('button[data-hart]');
  if(a){ HW.art = a.dataset.hart; hZeichnen(); return; }
  const dk = ev.target.closest('button[data-hdiktat]');
  if(dk){ diktieren(dk.dataset.hdiktat, dk.dataset.sprache, dk); return; }
  if(ev.target.closest('button[data-hbildweg]')){ HW.bild=null; hZeichnen(); return; }
  if(ev.target.closest('button[data-hzu]')){ hSchliessen(); return; }
  if(ev.target.closest('button[data-hsenden]')){ await hSenden(); return; }
  if(ev.target.closest('#h_ablage')){
    const e2 = document.createElement('input');
    e2.type='file'; e2.accept='image/*';
    e2.onchange = () => hBildAus(e2.files && e2.files[0]);
    e2.click();
  }
});

/* снимок вставляется из буфера прямо в окно */
addEventListener('paste', ev => {
  if(!HW.offen) return;
  const el = (ev.clipboardData||{}).items||[];
  for(const it of el) if(it.type && it.type.startsWith('image/')) { hBildAus(it.getAsFile()); ev.preventDefault(); return; }
});
document.getElementById('hfenster').addEventListener('dragover', ev => {
  ev.preventDefault();
  const a = document.getElementById('h_ablage'); if(a) a.classList.add('drauf');
});
document.getElementById('hfenster').addEventListener('dragleave', () => {
  const a = document.getElementById('h_ablage'); if(a) a.classList.remove('drauf');
});
document.getElementById('hfenster').addEventListener('drop', ev => {
  ev.preventDefault();
  const a = document.getElementById('h_ablage'); if(a) a.classList.remove('drauf');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if(f) hBildAus(f);
});

boot();
</script>
