<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контроль счёта · VAV Kaiser</title>
<style>
:root{--bg:#f2efe9;--surface:#fff;--surface2:#faf8f4;--ink:#1b2530;--muted:#5c6773;--line:#e6e1d7;--akz:#14586e;--ok:#2e7d5b;--warn:#b07d16;--crit:#b23f2b;--krit-bg:#fbeeea;--warn-bg:#fbf4e3;--ok-bg:#e9f4ee;--r:14px;--schatten:0 1px 3px rgba(20,30,40,.06),0 6px 24px rgba(20,30,40,.05);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--surface:#1a2129;--surface2:#161c23;--ink:#e9edf1;--muted:#95a1ad;--line:#2a333d;--akz:#5bb4cf;--ok:#5fc48f;--warn:#d9b154;--crit:#e2856f;--krit-bg:#2a1c19;--warn-bg:#292417;--ok-bg:#182a22;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:19px;margin:0} h2{font-size:15px;margin:0}
a{color:inherit}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 8px}
.nav a{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:9px;border:1px solid transparent}
.nav a.akt{color:#fff;background:var(--akz);border-color:var(--akz)} .nav .sp{flex:1} .nav a.aus{color:var(--muted);border-color:var(--line)}
.kopf{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.wer{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:9px;padding:6px 13px;cursor:pointer}
.tab.akt{background:var(--akz);border-color:var(--akz);color:#fff}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--schatten);margin-bottom:12px;border-left:3px solid var(--muted)}
.karte.ok{border-left-color:var(--ok)} .karte.hinweis{border-left-color:var(--warn)} .karte.pruefen{border-left-color:var(--warn)}
.karte.blockiert{border-left-color:var(--crit)} .karte.ausnahme{border-left-color:var(--akz)}
.k1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.crit{color:var(--crit);background:var(--krit-bg)} .chip.akz{color:var(--akz);background:var(--ok-bg)}
.meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 14px}
.items{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.item{font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;display:flex;gap:10px;align-items:flex-start}
.item .art{font-weight:600;flex-shrink:0;width:72px;font-size:12.5px;color:var(--muted)}
.item.item-blockiert{background:var(--krit-bg);border-color:transparent} .item.item-abweichung{background:var(--warn-bg);border-color:transparent}
.item.item-fehlt{background:var(--krit-bg);border-color:transparent} .item.item-hinweis{background:var(--warn-bg);border-color:transparent}
.aktion{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:6px 11px;cursor:pointer}
.btn.pri{background:var(--akz);border-color:var(--akz);color:#fff} .btn.crit{background:var(--krit-bg);border-color:var(--crit);color:var(--crit)} .btn:disabled{opacity:.45}
input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);color:var(--ink);width:100%}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.leer{color:var(--muted);font-size:13.5px;padding:10px 2px}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin:8px 0;display:none}.msg.auf{display:block}.msg.f{background:var(--krit-bg);color:var(--crit)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--schatten);margin-bottom:14px}
.faellig-karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--schatten);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.faellig-karte.ub{border-left:3px solid var(--crit)} .faellig-karte.bald{border-left:3px solid var(--warn)}
.faellig-euro{font-size:17px;font-weight:700;flex-shrink:0} .faellig-datum{font-size:12.5px;color:var(--muted)}
.gruende{font-size:12.5px;color:var(--crit);margin-top:4px}
details summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.anfrage-form{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.anfrage-form.auf{display:block}
</style>
</head><body>
<div class="wrap">
  <nav class="nav">
    <a href="/zentrum">Центр</a>
    <a href="/rechnung" class="akt">Контроль счёта</a>
    <a href="/aufgaben">Задачи</a>
    <a href="/dokument">Документы</a>
    <a href="/index.html">Разделы</a>
    <span class="sp"></span>
    <a href="/api/logout" class="aus">Выйти</a>
  </nav>
  <div class="kopf">
    <div><h1>Контроль счёта vs заказ</h1><div class="wer" id="wer"></div></div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="tabs">
    <button class="tab akt" id="tab-pruefen" onclick="showTab('pruefen')">Проверить счёт</button>
    <button class="tab" id="tab-liste" onclick="showTab('liste')">Список прогонов</button>
    <button class="tab" id="tab-faellig" onclick="showTab('faellig')">Просрочки</button>
  </div>

  <!-- Вкладка: запустить проверку -->
  <div id="pane-pruefen">
    <div class="form-karte">
      <div class="grid2" style="margin-bottom:12px">
        <div><label>ID счёта (beleg_id)</label><input type="number" id="f_beleg" placeholder="123" min="1"></div>
        <div><label>ID заказа (bestellung_id, необязательно)</label><input type="number" id="f_best" placeholder="456" min="1"></div>
      </div>
      <div class="aktion">
        <button class="btn pri" id="btn-pruefen">Запустить проверку</button>
        <button class="btn" id="btn-geaendert" title="Файл счёта заменён — сбросить исключения с устаревшим хэшем">Файл заменён</button>
      </div>
    </div>
    <div id="ergebnis-wrap"></div>
  </div>

  <!-- Вкладка: список прогонов -->
  <div id="pane-liste" style="display:none">
    <div class="form-karte" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div style="flex:1;min-width:140px"><label>Результат</label>
        <select id="f_ergebnis">
          <option value="">— все —</option>
          <option value="blockiert">blockiert</option>
          <option value="pruefen">pruefen</option>
          <option value="hinweis">hinweis</option>
          <option value="ok">ok</option>
          <option value="ausnahme_genehmigt">ausnahme genehmigt</option>
        </select>
      </div>
      <div style="flex:1;min-width:120px"><label>beleg_id</label><input type="number" id="f_liste_beleg" placeholder="необяз."></div>
      <div><button class="btn pri" id="btn-liste">Загрузить</button></div>
    </div>
    <div id="liste-wrap"></div>
  </div>

  <!-- Вкладка: просрочки -->
  <div id="pane-faellig" style="display:none">
    <div class="aktion" style="margin-bottom:12px">
      <button class="btn pri" id="btn-faellig">Обновить</button>
      <span style="font-size:13px;color:var(--muted)">Счета с просроченным или ближайшим сроком оплаты</span>
    </div>
    <div id="faellig-wrap"></div>
  </div>
</div>

<!-- Модальное окно: детали прогона + запрос исключения -->
<div id="modal-wrap" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;overflow-y:auto;padding:20px">
  <div style="max-width:640px;margin:0 auto;background:var(--surface);border-radius:var(--r);padding:20px;position:relative">
    <button onclick="closeModal()" style="position:absolute;top:12px;right:12px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer">✕ Закрыть</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const H=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EUR=c=>c==null?'—':((c||0)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let ICH = null;

const ERGEBNIS_LABEL = {
  ok:                ['ОК',          'ok'],
  hinweis:           ['Внимание',    'warn'],
  pruefen:           ['Проверить',   'warn'],
  blockiert:         ['Заблокирован','crit'],
  ausnahme_genehmigt:['Исключение',  'akz'],
  offen:             ['Открыт',      ''],
};

const ITEM_ART = {
  lieferant:'Подрядчик', objekt:'Объект', summe:'Сумма', kette:'Оплата',
  schluss:'Итоговый', nachtrag:'Доп.', dokument:'Документ', faellig:'Срок',
};

function msg(t, ok) {
  const m = document.getElementById('msg');
  m.textContent = t; m.className = 'msg auf ' + (ok ? 'ok' : 'f');
  setTimeout(() => { m.className = 'msg'; }, 5000);
}
async function api(path, method, body) {
  const o = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body) o.body = JSON.stringify(body);
  const r = await fetch(path, o);
  if (r.status === 401) { location.href = '/login?next=/rechnung'; return null; }
  const j = await r.json();
  if (!r.ok) throw new Error(j.fehler || r.status);
  return j;
}

// ── Вкладки ───────────────────────────────────────────────────────────────────
function showTab(name) {
  ['pruefen','liste','faellig'].forEach(n => {
    document.getElementById('pane-' + n).style.display = n === name ? '' : 'none';
    document.getElementById('tab-' + n).className = 'tab' + (n === name ? ' akt' : '');
  });
  if (name === 'faellig') ladeFaellig();
}

// ── Прогон проверки ───────────────────────────────────────────────────────────
function chipErgebnis(e) {
  const [lab, cls] = ERGEBNIS_LABEL[e] || [e, ''];
  return `<span class="chip ${cls}">${H(lab)}</span>`;
}

function renderItems(items) {
  if (!items || !items.length) return '';
  return '<div class="items">' + items.map(it => {
    const cls = it.status === 'blockiert' || it.status === 'fehlt' ? 'item-blockiert' :
                it.status === 'abweichung' || it.status === 'hinweis' ? 'item-hinweis' : '';
    const betrag = (it.soll_cent != null || it.ist_cent != null)
      ? `<span style="font-size:12px;color:var(--muted);margin-left:auto;flex-shrink:0">Ожидалось ${EUR(it.soll_cent)} · Факт ${EUR(it.ist_cent)}</span>`
      : '';
    return `<div class="item ${cls}">
      <span class="art">${H(ITEM_ART[it.art] || it.art)}</span>
      <span style="flex:1">${H(it.notiz || '')}</span>
      ${betrag}
    </div>`;
  }).join('') + '</div>';
}

function renderPruefErgebnis(r, belegId) {
  if (!r) return '';
  const [lab, cls] = ERGEBNIS_LABEL[r.ergebnis] || [r.ergebnis, ''];
  let html = `<div class="karte ${r.ergebnis}">
    <div class="k1">
      <div><b>Прогон #${r.prueflauf_id}</b></div>
      <span class="chip ${cls}">${H(lab)}</span>
    </div>
    ${renderItems(r.items)}`;

  if (r.aufgabe_id) {
    html += `<div class="meta" style="margin-top:8px"><span>Задача создана: ${H(r.aufgabe_id)}</span></div>`;
  }

  if (r.ergebnis === 'blockiert') {
    html += `<div class="aktion">
      <button class="btn" onclick="openAnfrage(${r.prueflauf_id})">Запросить исключение…</button>
    </div>`;
  }
  html += '</div>';
  return html;
}

document.getElementById('btn-pruefen').onclick = async function() {
  const belegId = Number(document.getElementById('f_beleg').value);
  if (!belegId) { msg('Укажите ID счёта'); return; }
  const bestId = Number(document.getElementById('f_best').value) || null;
  this.disabled = true;
  try {
    const r = await api('/api/rechnung/pruefung', 'POST', { beleg_id: belegId, bestellung_id: bestId });
    if (!r) return;
    document.getElementById('ergebnis-wrap').innerHTML = renderPruefErgebnis(r, belegId);
    if (r.ergebnis === 'ok' || r.ergebnis === 'hinweis') msg('Проверка завершена: ' + r.ergebnis, true);
    else msg('Проверка: ' + r.ergebnis);
  } catch (e) { msg(e.message); }
  finally { this.disabled = false; }
};

document.getElementById('btn-geaendert').onclick = async function() {
  const belegId = Number(document.getElementById('f_beleg').value);
  if (!belegId) { msg('Укажите ID счёта'); return; }
  this.disabled = true;
  try {
    const r = await api('/api/rechnung/beleg-geaendert', 'POST', { beleg_id: belegId });
    if (!r) return;
    if (r.ausnahmen_deaktiviert > 0) {
      msg(`Файл изменён: ${r.ausnahmen_deaktiviert} исключение(й) сброшено — запустите проверку заново`);
    } else {
      msg('Активных исключений с другим хэшем нет — ничего не изменилось', true);
    }
  } catch (e) { msg(e.message); }
  finally { this.disabled = false; }
};

// ── Список прогонов ───────────────────────────────────────────────────────────
document.getElementById('btn-liste').onclick = ladeListe;
async function ladeListe() {
  const ergebnis = document.getElementById('f_ergebnis').value;
  const belegId = document.getElementById('f_liste_beleg').value;
  const qs = new URLSearchParams();
  if (ergebnis) qs.set('ergebnis', ergebnis);
  if (belegId) qs.set('beleg_id', belegId);
  document.getElementById('liste-wrap').innerHTML = '<div class="leer">Загрузка…</div>';
  try {
    const rows = await api('/api/rechnung/pruefung?' + qs);
    if (!rows) return;
    if (!rows.length) { document.getElementById('liste-wrap').innerHTML = '<div class="leer">Нет прогонов</div>'; return; }
    document.getElementById('liste-wrap').innerHTML = rows.map(r => {
      const [lab, cls] = ERGEBNIS_LABEL[r.ergebnis] || [r.ergebnis, ''];
      const dt = r.angelegt ? new Date(r.angelegt).toLocaleString('de-DE', { dateStyle:'short', timeStyle:'short' }) : '?';
      return `<div class="karte ${r.ergebnis}" style="cursor:pointer" onclick="openDetail(${r.id})">
        <div class="k1">
          <div><b>${H(r.lieferant || '—')}</b> <span style="font-size:12.5px;color:var(--muted)">#${r.id}</span></div>
          <span class="chip ${cls}">${H(lab)}</span>
        </div>
        <div class="meta">
          <span>${EUR(r.betrag_cent)}</span>
          ${r.objekt_nr ? `<span>${H(r.objekt_nr)}</span>` : ''}
          ${r.art ? `<span>${H(r.art)}</span>` : ''}
          <span>${dt}</span>
          ${r.ausnahme_aktiv ? '<span class="chip akz">исключение</span>' : ''}
        </div>
      </div>`;
    }).join('');
  } catch (e) { document.getElementById('liste-wrap').innerHTML = `<div class="leer">${H(e.message)}</div>`; }
}

// ── Детали прогона ────────────────────────────────────────────────────────────
async function openDetail(id) {
  document.getElementById('modal-body').innerHTML = '<div class="leer">Загрузка…</div>';
  document.getElementById('modal-wrap').style.display = '';
  try {
    const r = await api('/api/rechnung/pruefung/eins?id=' + id);
    if (!r) return;
    const [lab, cls] = ERGEBNIS_LABEL[r.ergebnis] || [r.ergebnis, ''];
    const dt = r.angelegt ? new Date(r.angelegt).toLocaleString('de-DE', { dateStyle:'medium', timeStyle:'short' }) : '?';
    let html = `<h2 style="margin-bottom:12px">Прогон #${r.id} — ${H(r.lieferant || '?')}</h2>
      <div class="meta" style="margin-bottom:12px">
        <span class="chip ${cls}">${H(lab)}</span>
        <span>${EUR(r.betrag_cent)}</span>
        ${r.objekt_nr ? `<span>${H(r.objekt_nr)}</span>` : ''}
        <span>${dt}</span>
        <span>beleg #${r.beleg_id}</span>
        ${r.bestellung_id ? `<span>заказ #${r.bestellung_id}</span>` : ''}
      </div>
      ${renderItems(r.items)}`;

    if (r.ausnahme) {
      html += `<div class="karte ausnahme" style="margin-top:12px">
        <b>Исключение утверждено</b>
        <div class="meta">
          <span>Андрей (${H(r.ausnahme.genehmigt_von)})</span>
          <span>${new Date(r.ausnahme.genehmigt_am).toLocaleDateString('de-DE')}</span>
          ${r.ausnahme.basis ? `<span>Основание: ${H(r.ausnahme.basis)}</span>` : ''}
        </div>
        <div style="font-size:13px;margin-top:6px">${H(r.ausnahme.grund)}</div>
        <div class="meta" style="margin-top:6px;font-size:12px">
          <span>IBAN-проверка: всегда активна</span>
          <span>Дублет-проверка: всегда активна</span>
        </div>
      </div>`;
    }

    if (r.anfrage) {
      const aStatus = {offen:'открыт',an_oleg:'у Олега',an_andrej:'у Андрея',genehmigt:'одобрен',abgelehnt:'отклонён'};
      html += `<div class="karte hinweis" style="margin-top:12px">
        <b>Запрос исключения</b> — ${H(aStatus[r.anfrage.status] || r.anfrage.status)}
        <div class="meta"><span>${H(r.anfrage.grund || '?')}</span></div>
        ${ICH && ICH.rolle === 'disponent' && r.anfrage.status === 'an_oleg'
          ? `<div class="aktion"><button class="btn pri" onclick="передатьАндрею(${r.anfrage.id}, ${r.id})">Передать Андрею</button></div>`
          : ''}
        ${ICH && ICH.rolle === 'gf' && r.anfrage.status === 'an_andrej' && !r.ausnahme
          ? `<div id="approve-form-${r.id}" class="anfrage-form">
              <div style="margin-bottom:8px"><label>Основание (обязательно)</label><textarea id="approve-basis-${r.id}" rows="2"></textarea></div>
              <div style="margin-bottom:8px"><label>Решение (обязательно)</label><textarea id="approve-grund-${r.id}" rows="2"></textarea></div>
              <div class="aktion">
                <button class="btn pri" onclick="genehmigen(${r.id})">Утвердить исключение</button>
                <button class="btn" onclick="hideApproveForm(${r.id})">Отмена</button>
              </div>
            </div>
            <div class="aktion">
              <button class="btn crit" onclick="showApproveForm(${r.id})">Утвердить исключение…</button>
            </div>`
          : ''}
      </div>`;
    }

    if (r.ergebnis === 'blockiert' && !r.ausnahme && !r.anfrage) {
      html += `<div id="anfrage-form-${r.id}" class="anfrage-form">
        <div style="margin-bottom:8px"><label>Основание (обязательно)</label><textarea id="anf-grund-${r.id}" rows="2" placeholder="Доп. работы, согласовано устно, …"></textarea></div>
        <div style="margin-bottom:8px"><label>Примечание</label><textarea id="anf-notiz-${r.id}" rows="2" placeholder="Необязательно"></textarea></div>
        <div class="aktion">
          <button class="btn pri" onclick="sendeAnfrage(${r.id})">Отправить запрос Олегу</button>
          <button class="btn" onclick="hideAnfrageForm(${r.id})">Отмена</button>
        </div>
      </div>
      <div class="aktion" style="margin-top:10px">
        <button class="btn" onclick="showAnfrageForm(${r.id})">Запросить исключение…</button>
      </div>`;
    }

    document.getElementById('modal-body').innerHTML = html;
  } catch (e) {
    document.getElementById('modal-body').innerHTML = `<div class="leer">${H(e.message)}</div>`;
  }
}

function showAnfrageForm(id) {
  document.getElementById('anfrage-form-' + id).className = 'anfrage-form auf';
}
function hideAnfrageForm(id) {
  document.getElementById('anfrage-form-' + id).className = 'anfrage-form';
}
function showApproveForm(id) {
  document.getElementById('approve-form-' + id).className = 'anfrage-form auf';
}
function hideApproveForm(id) {
  document.getElementById('approve-form-' + id).className = 'anfrage-form';
}

async function openAnfrage(prueflaufId) {
  openDetail(prueflaufId);
}

async function sendeAnfrage(prueflaufId) {
  const grund = document.getElementById('anf-grund-' + prueflaufId).value.trim();
  const notiz = document.getElementById('anf-notiz-' + prueflaufId).value.trim();
  if (!grund) { msg('Нужно основание'); return; }
  try {
    await api('/api/rechnung/ausnahme-beantragen', 'POST', { prueflauf_id: prueflaufId, grund, notiz });
    msg('Запрос отправлен Олегу', true);
    openDetail(prueflaufId);
  } catch (e) { msg(e.message); }
}

async function передатьАндрею(anfraId, prueflaufId) {
  try {
    await api('/api/rechnung/ausnahme-andrej', 'POST', { anfrage_id: anfraId });
    msg('Передано Андрею', true);
    openDetail(prueflaufId);
  } catch (e) { msg(e.message); }
}

async function genehmigen(prueflaufId) {
  const basis = document.getElementById('approve-basis-' + prueflaufId).value.trim();
  const grund = document.getElementById('approve-grund-' + prueflaufId).value.trim();
  if (!basis || !grund) { msg('Заполните все поля'); return; }
  try {
    await api('/api/rechnung/ausnahme-genehmigen', 'POST', { prueflauf_id: prueflaufId, basis, grund });
    msg('Исключение утверждено', true);
    openDetail(prueflaufId);
    ladeListe();
  } catch (e) { msg(e.message); }
}

function closeModal() {
  document.getElementById('modal-wrap').style.display = 'none';
}

// ── Просрочки ─────────────────────────────────────────────────────────────────
document.getElementById('btn-faellig').onclick = ladeFaellig;
async function ladeFaellig() {
  document.getElementById('faellig-wrap').innerHTML = '<div class="leer">Загрузка…</div>';
  try {
    const rows = await api('/api/rechnung/faellig');
    if (!rows) return;
    if (!rows.length) { document.getElementById('faellig-wrap').innerHTML = '<div class="leer">Нет срочных платежей</div>'; return; }
    document.getElementById('faellig-wrap').innerHTML = rows.map(r => {
      const istUb = r.faellig_status === 'uberfaellig';
      const dt = r.faellig ? new Date(r.faellig).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '?';
      const grHtml = r.gruende && r.gruende.length
        ? `<div class="gruende">${r.gruende.map(g => H(g)).join(' · ')}</div>`
        : '';
      return `<div class="faellig-karte ${istUb ? 'ub' : 'bald'}">
        <div class="faellig-euro">${(r.betrag || 0).toLocaleString('de-DE', {minimumFractionDigits:2})} €</div>
        <div style="flex:1">
          <div><b>${H(r.lieferant || '?')}</b> <span style="font-size:12.5px;color:var(--muted)">${H(r.rechnung_nr || '')}</span></div>
          <div class="faellig-datum">${istUb ? '⚠ Просрочено' : 'Срок'} ${dt}</div>
          ${grHtml}
        </div>
        <button class="btn" style="flex-shrink:0" onclick="document.getElementById('f_beleg').value=${r.beleg_id};showTab('pruefen')">Проверить</button>
      </div>`;
    }).join('');
  } catch (e) { document.getElementById('faellig-wrap').innerHTML = `<div class="leer">${H(e.message)}</div>`; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const me = await api('/api/ich');
    if (!me) return;
    ICH = me;
    document.getElementById('wer').textContent = me.name + ' · ' + me.rolle;
  } catch (e) { /* noop */ }
}
init();
