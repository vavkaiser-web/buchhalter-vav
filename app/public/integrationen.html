<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Интеграции · VAV Kaiser</title>
<style>
:root{--bg:#f2efe9;--surface:#fff;--surface2:#faf8f4;--ink:#1b2530;--muted:#5c6773;--line:#e6e1d7;
 --akz:#14586e;--ok:#2e7d5b;--warn:#b07d16;--crit:#b23f2b;--ok-bg:#e9f4ee;--warn-bg:#fbf4e3;--krit-bg:#fbeeea;--info-bg:#e6f0f4;
 --r:13px;--schatten:0 1px 3px rgba(20,30,40,.06),0 6px 22px rgba(20,30,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--surface:#1a2129;--surface2:#161c23;
 --ink:#e9edf1;--muted:#95a1ad;--line:#2a333d;--akz:#5bb4cf;--ok:#5fc48f;--warn:#d9b154;--crit:#e2856f;
 --ok-bg:#182a22;--warn-bg:#292417;--krit-bg:#2a1c19;--info-bg:#182731}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 100px}
a{color:var(--akz)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 10px}
.nav a{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:9px;border:1px solid transparent}
.nav a.akt{color:#fff;background:var(--akz);border-color:var(--akz)} .nav .sp{flex:1}
h1{font-size:19px;margin:0 0 2px} .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--schatten);padding:13px 15px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.t{font-weight:600} .m{font-size:12.5px;color:var(--muted)}
.badge{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.leer{color:var(--muted);text-align:center;padding:24px 2px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin:8px 0;display:none} .msg.auf{display:block} .msg.f{background:var(--krit-bg);color:var(--crit)}
.badge.crit{background:var(--krit-bg);color:var(--crit);border-color:transparent}
.qs{border-left:3px solid var(--muted);padding-left:10px} .qs.ok{border-left-color:var(--ok)} .qs.fehler{border-left-color:var(--crit)} .qs.veraltet{border-left-color:var(--warn)}
.kv{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer}
.btn.pri{background:var(--akz);border-color:var(--akz);color:#fff} .btn.crit{color:var(--crit)}
.banner{padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid transparent}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
input.thr{width:80px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface2);color:var(--ink)}
</style>
</head><body>
<div class="wrap">
  <nav class="nav">
    <a href="/zentrum">Центр</a>
    <a href="/objekt">Объекты</a>
    <a href="/integrationen" class="akt">Интеграции</a>
    <a href="/aufgaben">Задачи</a>
    <span class="sp"></span>
    <a href="/api/logout">Выйти</a>
  </nav>
  <h1>Интеграции и качество данных</h1>
  <div class="sub">Контракт обмена по единому номеру объекта. Повторная доставка не плодит дубли; устаревшее событие не перезаписывает новое (§19).</div>
  <div class="msg" id="msg"></div>
  <div id="app_top"></div>
  <div id="app"><div class="leer">Загрузка…</div></div>
</div>
<script>
const H=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=(iso)=>{ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleString('de-DE'); };
const SST={empfangen:'принято',verarbetet:'обработано',verarbeitet:'обработано',fehler:'ошибка',veraltet_ignoriert:'устаревшее — проигнорировано'};
async function J(u){ const r=await fetch(u,{credentials:'same-origin'}); if(r.status===401){location.href='/login?next=/integrationen';throw new Error('нет сессии');} const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.fehler||('HTTP '+r.status)); return j; }
async function P(u,body){ const r=await fetch(u,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.fehler||('HTTP '+r.status)); return j; }
const VERB={ok:'соединение есть',fehler:'нет соединения',unbekannt:'нет данных'};
let ISGF=false;
function minText(m){ if(m==null) return '—'; if(m<60) return m+' мин'; if(m<1440) return Math.round(m/60)+' ч'; return Math.round(m/1440)+' дн'; }
function statusCard(s){
  ISGF = s.ich && s.ich.rolle==='gf';
  let h='';
  if(s.bank_vorlaeufig) h+='<div class="banner">Банковские данные (FinMap) устарели или недоступны — денежный прогноз <strong>предварительный</strong>. Последние данные: '+T(s.bank_stand)+'. Готовые счета остаются доступны; перевод выполняется вручную в банке.</div>';
  else h+='<div class="banner ok">Банковские данные актуальны — прогноз по деньгам подтверждён источником.</div>';
  h+='<div class="card"><h2>Состояние источников</h2>';
  h+=(s.quellen||[]).map(q=>{
    const cls=q.verbindung==='fehler'?'fehler':(q.veraltet?'veraltet':(q.verbindung==='ok'?'ok':''));
    const badge=q.verbindung==='fehler'?'<span class="badge crit">'+VERB.fehler+'</span>':(q.verbindung==='ok'?'<span class="badge ok">'+VERB.ok+'</span>':'<span class="badge warn">'+VERB.unbekannt+'</span>');
    let h2='<div class="row"><div class="qs '+cls+'"><span class="t">'+H(q.titel)+'</span>'
      +'<div class="kv"><span>последнее получение: '+T(q.letzter_erfolg)+'</span>'
      +'<span>обработано до: '+T(q.verarbeitet_bis)+'</span>'
      +'<span>остаток: '+(q.rueckstand_bekannt?q.rueckstand:'неизвестно')+'</span>'
      +(q.veraltet?'<span style="color:var(--warn)">устарело (порог '+minText(q.schwelle_minuten)+(q.schwelle_bestaetigt?'':' · требует согласования')+')</span>':'')
      +(q.sync_unvollstaendig?'<span style="color:var(--warn)">соединение есть, синхронизация неполная</span>':'')
      +(q.verbindung==='fehler'?'<span style="color:var(--crit)">'+H(q.fehler_text||'')+' · повтор: '+H(q.wiederholung||'—')+'</span>':'')
      +(q.verbindung==='fehler'&&q.stand_daten?'<span>показаны данные от '+T(q.stand_daten)+'</span>':'')
      +'</div>'
      +(ISGF&&q.bank?'<div class="kv" style="margin-top:6px">Порог устаревания: <input class="thr" id="thr_'+H(q.quelle)+'" value="'+q.schwelle_minuten+'"> мин <button class="btn" data-thr="'+H(q.quelle)+'">сохранить</button></div>':'')
      +'<div class="kv" style="margin-top:6px"><button class="btn" data-ok="'+H(q.quelle)+'">тест: успех</button><button class="btn crit" data-fail="'+H(q.quelle)+'">тест: сбой</button></div>'
      +'</div>'+badge+'</div>';
    return h2;
  }).join('');
  h+='<div class="hint">Доступность соединения и полнота синхронизации показаны отдельно. При сбое сохраняются последние данные с их датой; создаётся одна задача ответственному бухгалтеру; неизвестные значения не превращаются в ноль. Технические ошибки — в служебном журнале.</div></div>';
  return h;
}
async function laden(){
  try{
    let top='';
    try{ top=statusCard(await J('/api/integration/status')); }catch(e){ top=''; }
    const d=await J('/api/integrationen');
    document.getElementById('app_top').innerHTML=top;
    let h='<div class="card"><h2>Источники</h2>';
    h+=(d.quellen||[]).map(q=>'<div class="row"><div><span class="t">'+H(q.titel)+'</span><div class="m">событий: '+q.ereignisse+' · последнее: '+T(q.letzte)+'</div></div>'
      +'<span class="badge '+(q.verbunden?'ok':'warn')+'">'+(q.verbunden?'есть события':H(q.status))+'</span></div>').join('');
    h+='<div class="hint">Интеграции не объявляются готовыми на тестовых данных. Пока источники не подключены — данные вносит бухгалтер вручную; при подключении события пойдут в журнал ниже.</div></div>';
    const jr=d.journal||[];
    h+='<div class="card"><h2>Журнал событий ('+jr.length+')</h2>';
    if(jr.length){ h+=jr.map(x=>'<div class="row"><div><span class="t">'+H(x.quelle)+' · '+H(x.ereignis)+'</span><div class="m">'+(x.objekt_nr?H(x.objekt_nr)+' · ':'')+'v'+x.version+' · '+T(x.empfangen)+(x.fehler_text?' · '+H(x.fehler_text):'')+'</div></div>'
      +'<span class="badge '+(x.status==='fehler'?'warn':(x.status==='veraltet_ignoriert'?'warn':'ok'))+'">'+H(SST[x.status]||x.status)+'</span></div>').join(''); }
    else h+='<div class="leer">Событий ещё нет — источники не подключены.</div>';
    h+='</div>';
    document.getElementById('app').innerHTML=h;
  }catch(e){ document.getElementById('app').innerHTML='<div class="leer">Не удалось загрузить: '+H(e.message)+'</div>'; }
}
document.getElementById('app_top').addEventListener('click',async e=>{
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  let b;
  try{
    if((b=e.target.closest('[data-ok]'))){ b.disabled=true; await P('/api/integration/meldung',{quelle:b.dataset.ok,ergebnis:'erfolg',rueckstand:0}); laden(); return; }
    if((b=e.target.closest('[data-fail]'))){ b.disabled=true; await P('/api/integration/meldung',{quelle:b.dataset.fail,ergebnis:'fehler',fehler_text:'источник не отвечает (тест)',wiederholung:'повтор через 15 мин',code:'TIMEOUT',detail:'test'}); laden(); return; }
    if((b=e.target.closest('[data-thr]'))){ b.disabled=true; await P('/api/integration/schwelle',{quelle:b.dataset.thr,schwelle_minuten:Number(g('thr_'+b.dataset.thr))}); laden(); return; }
  }catch(err){ const m=document.getElementById('msg'); m.textContent=err.message; m.className='msg auf f'; if(b)b.disabled=false; }
});
laden();
</script>
<script src="/rolle.js"></script>
</body></html>
