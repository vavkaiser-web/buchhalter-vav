<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buchhalter VAV</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#14455E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#EBE7DF;--surface:#FCFAF6;--surface-2:#F4F0E8;--ink:#1A1613;--ink-2:#4B4238;
 --muted:#877C6F;--line:#DBD3C5;--accent:#14455E;--accent-2:#1D6285;--accent-ink:#FFFDF9;--crit:#A02F26;
 --f-d:"Archivo","Arial Narrow",Arial,sans-serif;--f-b:"Hanken Grotesk",system-ui,sans-serif;
 --f-m:"IBM Plex Mono",ui-monospace,monospace;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#141210;--surface:#1E1A15;
 --surface-2:#26221A;--ink:#EFE9DE;--ink-2:#C2B8A8;--muted:#8E8474;--line:#3A342A;
 --accent:#7FB9D8;--accent-2:#9BCCE6;--accent-ink:#0F2029;--crit:#E4877B;}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--ground);color:var(--ink);font-family:var(--f-b);
 display:grid;place-items:center;padding:24px}
.karte{width:100%;max-width:330px;background:var(--surface);border:1px solid var(--line);
 border-radius:14px;padding:28px 26px 24px;box-shadow:0 2px 5px rgba(46,34,18,.07),0 18px 40px -20px rgba(46,34,18,.35)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-variation-settings:"wdth" 88;
 font-weight:800;font-size:13px;letter-spacing:.07em;margin-bottom:22px}
.sq{width:22px;height:22px;border-radius:6px;flex:0 0 22px;position:relative;
 background:linear-gradient(155deg,var(--accent-2),var(--accent))}
.sq::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;
 border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);border-bottom-left-radius:2px}
h1{font-family:var(--f-d);font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
p{margin:0 0 20px;font-size:13.5px;color:var(--muted);line-height:1.55}
label{font-family:var(--f-m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
 border-radius:8px;padding:11px 13px;font-size:16px;font-family:var(--f-m)}
#pin{letter-spacing:.3em;text-align:center}
label.zweit{margin-top:14px}
input:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(29,98,133,.16)}
button{width:100%;margin-top:14px;padding:11px;border-radius:8px;border:1px solid var(--accent);
 background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);
 font-family:var(--f-b);font-size:14px;font-weight:600;cursor:pointer;
 box-shadow:0 1px 2px rgba(20,69,94,.28),0 8px 18px -10px rgba(20,69,94,.55);transition:filter .13s,transform .13s}
button:hover{filter:brightness(1.09);transform:translateY(-1px)}
button:disabled{opacity:.5;transform:none;cursor:default}
.fehler{margin-top:12px;font-size:13px;color:var(--crit);min-height:19px}
.schnell{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.schnell .t{font-family:var(--f-m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.rollen{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button.rolle{width:100%;margin:0;padding:9px 8px;border-radius:8px;border:1px solid var(--line);
 background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13px;box-shadow:none}
button.rolle:hover{filter:none;transform:none;background:var(--line)}
</style></head><body>
<form class="karte" id="f">
  <div class="mark"><span class="sq"></span>BUCHHALTER VAV</div>
  <h1>Вход</h1>
  <p>Приложение фирмы VAV Kaiser. Доступ по логину и ПИН-коду.</p>
  <label for="login">Логин</label>
  <input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
  <label for="pin" class="zweit">ПИН</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
  <button id="b" type="submit">Войти</button>
  <div class="fehler" id="e"></div>
  <div class="schnell">
    <div class="t">Быстрый вход · тест</div>
    <div class="rollen">
      <button type="button" class="rolle" data-l="andrej">Владелец</button>
      <button type="button" class="rolle" data-l="buch">Бухгалтер</button>
      <button type="button" class="rolle" data-l="oleg">Ответственный 1</button>
      <button type="button" class="rolle" data-l="oleg2">Ответственный 2</button>
      <button type="button" class="rolle" data-l="ma_a">Сотрудник А</button>
      <button type="button" class="rolle" data-l="ma_b">Сотрудник Б</button>
    </div>
  </div>
</form>
<script>
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='Проверяю…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:document.getElementById('login').value,
                           pin:document.getElementById('pin').value})});
    const j=await r.json().catch(()=>({}));
    // После входа — только на известный адрес /arbeit, иначе как раньше на /.
    if(r.ok){ location.href=new URLSearchParams(location.search).get('next')==='/arbeit'?'/arbeit':'/'; return; }
    e.textContent = j.fehler || 'Не получилось войти';
  }catch(err){ e.textContent='Сервер не отвечает'; }
  b.disabled=false; b.textContent='Войти';
  document.getElementById('pin').value=''; document.getElementById('pin').focus();
});
document.querySelectorAll('.rolle').forEach(btn=>btn.addEventListener('click',async()=>{
  e.textContent=''; document.querySelectorAll('.rolle').forEach(x=>x.disabled=true);
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:btn.dataset.l,pin:'demo-2409'})});
    if(r.ok){ location.href='/'; return; }
    const j=await r.json().catch(()=>({})); e.textContent=j.fehler||'Не получилось войти';
  }catch(err){ e.textContent='Сервер не отвечает'; }
  document.querySelectorAll('.rolle').forEach(x=>x.disabled=false);
}));
</script></body></html>
